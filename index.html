<script>
const SUPABASE_URL='https://jtukhhpdypjaknrozfxz.supabase.co';
const SUPABASE_KEY='sb_publishable_8oivtg25TBra9X0iYlkkhA_kAoaRUNz';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let db={users:[],superstars:[],championships:[],champions:[],championHistory:[],shows:[],transactions:[],gimmickSubmissions:[],news:[],announcements:[],activityLog:[],superstarManagement:[],awards:[],hallOfFame:[],showMatches:[],tryouts:[],trash:[],permissions:[]}, current=null, page='News';
let unsavedChanges=false, pendingDeletes=[], pendingChanges=[];function unsavedCount(){return pendingChanges.length+pendingDeletes.length}
function markUnsaved(table=null,id=null,kind=null){
 unsavedChanges=true;
 if(table&&id){
  const key=table+'|'+id;
  const i=pendingChanges.findIndex(x=>x.key===key);
  const item={key,table,id,kind};
  if(i>=0)pendingChanges[i]=item;else pendingChanges.push(item);
 }
 toastMsg('Unsaved changes — go to Settings to save');
}


function mapRows(rows,kind){
 return (rows||[]).map(x=>{
  if(kind==='profiles')return {id:x.id,username:x.username||'',displayName:x.display_name||'',role:x.role||'WxRC Superstar',superstarId:x.superstar_id||''};
  if(kind==='champions')return {id:x.id,superstarId:x.superstar_id,titleId:x.title_id,dateWon:x.date_won,image:x.image||'',notes:x.notes||''};
  if(kind==='history')return {id:x.id,superstarId:x.superstar_id,superstarName:x.superstar_name||'',titleId:x.title_id,dateWon:x.date_won,dateLost:x.date_lost||'',image:x.image||'',notes:x.notes||''};
  if(kind==='shows')return {id:x.id,name:x.name||'',date:x.show_date||'',time:x.show_time||'',status:x.status||'',venue:x.venue||'',image:x.image||''};
  if(kind==='transactions')return {id:x.id,person:x.person||'',amount:x.amount||0,note:x.note||'',date:x.transaction_date||''};
  if(kind==='gimmicks')return {id:x.id,userId:x.user_id||'',name:x.name||'',nickname:x.nickname||'',brand:x.brand||'',status:x.status||'',finisher:x.finisher||'',signature:x.signature||'',theme:x.theme||'',debut:x.debut||'',height:x.height||'',weight:x.weight||'',notes:x.notes||'',image:x.image||'',reviewStatus:x.review_status||'Pending',submittedBy:'Online User'};
  return x;
 });
}
async function loadOnlineData(){
 const specs=[
  ['superstars','superstars','created_at'],
  ['championships','championships','created_at'],
  ['champions','champions','created_at'],
  ['champion_history','history','created_at'],
  ['shows','shows','created_at'],
  ['news','news','published_at'],
  ['announcements','announcements','created_at'],
  ['awards','awards','created_at'],
  ['hall_of_fame','hallOfFame','created_at']
 ];
 const results=await Promise.all(specs.map(async ([table,kind,order])=>{
  try{
   const r=await sb.from(table).select('*').order(order,{ascending:table==='news'?false:true});
   if(r.error){console.error(table,r.error);return {table,kind,ok:false,error:r.error}}
   return {table,kind,ok:true,data:r.data||[]};
  }catch(error){console.error(table,error);return {table,kind,ok:false,error}}
 }));
 for(const r of results){
  if(!r.ok)continue;
  if(r.table==='superstars')db.superstars=mapRows(r.data);
  else if(r.table==='championships')db.championships=mapRows(r.data);
  else if(r.table==='champions')db.champions=mapRows(r.data,'champions');
  else if(r.table==='champion_history')db.championHistory=mapRows(r.data,'history');
  else if(r.table==='shows')db.shows=mapRows(r.data,'shows');
  else if(r.table==='news')db.news=r.data.map(x=>({id:x.id,title:x.title||'',content:x.content||'',author:x.author||'',image:x.image||'',publishedAt:x.published_at||x.created_at||''}));
  else if(r.table==='announcements')db.announcements=r.data||[];
  else if(r.table==='awards')db.awards=r.data||[];
  else if(r.table==='hall_of_fame')db.hallOfFame=r.data||[];
 }
 if(current && isManagement()){
  const extra=await Promise.allSettled([
   sb.from('profiles').select('*'),
   sb.from('transactions').select('*').order('created_at'),
   sb.from('gimmick_submissions').select('*').order('created_at'),
   sb.from('activity_log').select('*').order('created_at',{ascending:false}),
   sb.from('superstar_management').select('*'),
   sb.from('show_matches').select('*').order('created_at'),
   sb.from('tryouts').select('*').order('created_at',{ascending:false}),
   sb.from('recently_deleted').select('*').order('deleted_at',{ascending:false}),
   sb.from('admin_permissions').select('*')
  ]);
  const vals=extra.map(x=>x.status==='fulfilled'?x.value:null);
  if(vals[0]&&!vals[0].error)db.users=mapRows(vals[0].data,'profiles');
  if(vals[1]&&!vals[1].error)db.transactions=mapRows(vals[1].data,'transactions');
  if(vals[2]&&!vals[2].error)db.gimmickSubmissions=mapRows(vals[2].data,'gimmicks');
  if(vals[3]&&!vals[3].error)db.activityLog=vals[3].data||[];
  if(vals[4]&&!vals[4].error)db.superstarManagement=vals[4].data||[];
  if(vals[5]&&!vals[5].error)db.showMatches=vals[5].data||[];
  if(vals[6]&&!vals[6].error)db.tryouts=vals[6].data||[];
  if(vals[7]&&!vals[7].error)db.trash=vals[7].data||[];
  if(vals[8]&&!vals[8].error)db.permissions=vals[8].data||[];
 }
 return results;
}
let saveInProgress=null;
async function commitAllChanges(){
 if(!canEdit())return false;
 if(saveInProgress)return await saveInProgress;
 saveInProgress=(async()=>{
  const rowFor=(table,id)=>{
   if(table==='profiles'){const x=db.users.find(v=>v.id===id);return x&&{username:x.username,display_name:x.displayName,role:x.role,superstar_id:x.superstarId||null}}
   if(table==='superstars'){const x=db.superstars.find(v=>v.id===id);return x&&{id:x.id,name:x.name,nickname:x.nickname||null,brand:x.brand||null,status:x.status||null,finisher:x.finisher||null,signature:x.signature||null,theme:x.theme||null,debut:x.debut||null,height:x.height||null,weight:x.weight||null,wins:Number(x.wins||0),losses:Number(x.losses||0),image:x.image||null}}
   if(table==='championships'){const x=db.championships.find(v=>v.id===id);return x&&{id:x.id,name:x.name,brand:x.brand||null,status:x.status||null,image:x.image||null}}
   if(table==='champions'){const x=db.champions.find(v=>v.id===id);return x&&{id:x.id,superstar_id:x.superstarId,title_id:x.titleId,date_won:x.dateWon,image:x.image||null,notes:x.notes||null}}
   if(table==='champion_history'){const x=db.championHistory.find(v=>v.id===id);return x&&{id:x.id,superstar_id:x.superstarId||null,superstar_name:x.superstarName||null,title_id:x.titleId,date_won:x.dateWon,date_lost:x.dateLost||null,image:x.image||null,notes:x.notes||null}}
   if(table==='shows'){const x=db.shows.find(v=>v.id===id);return x&&{id:x.id,name:x.name,show_date:x.date||null,show_time:x.time||null,status:x.status||null,venue:x.venue||null,image:x.image||null}}
   if(table==='transactions'){const x=db.transactions.find(v=>v.id===id);return x&&{id:x.id,person:x.person,amount:Number(x.amount||0),note:x.note||null,transaction_date:x.date||null}}
   return null;
  };
  for(const d of pendingDeletes){
   const r=await sb.from(d.table).delete().eq('id',d.id);
   if(r.error){alert('SAVE FAILED — Delete: '+r.error.message);return false}
  }
  for(const c of pendingChanges){
   if(pendingDeletes.some(d=>d.table===c.table&&d.id===c.id))continue;
   const row=rowFor(c.table,c.id); if(!row)continue;
   let r;
   if(c.table==='profiles')r=await sb.from(c.table).update(row).eq('id',c.id);
   else if(c.kind==='new')r=await sb.from(c.table).insert(row);
   else r=await sb.from(c.table).update(row).eq('id',c.id);
   if(r.error){alert('SAVE FAILED — '+c.table+': '+r.error.message);return false}
  }
  pendingDeletes=[];pendingChanges=[];unsavedChanges=false;
  await loadOnlineData();
  toastMsg('✓ All changes saved');
  return true;
 })();
 try{return await saveInProgress}finally{saveInProgress=null}
}
async function save(table=null,id=null,kind=null){markUnsaved(table,id,kind);return true;}

function isAdministrator(){return current && ['WxRC Owner','WxRC Administrator','WxRC Admin','Administrator'].includes(current.role)}
function isModerator(){return current?.role==='WxRC Moderator'}
function isManagement(){return isAdministrator()||isModerator()}

 openModal('Create WxRC Account',`<div class="sub" style="margin-bottom:14px">Choose the account type and enter the 6-digit registration code created by the WxRC Owner.</div><form id="codeForm"><div class="field"><label>ROLE</label><select name="role"><option value="WxRC Superstar">WxRC Superstar</option><option value="WxRC Moderator">WxRC Moderator</option><option value="WxRC Administrator">WxRC Administrator</option></select></div>${formField('code')}<button class="btn primary full">Continue</button></form>`);
 codeForm.onsubmit=async e=>{e.preventDefault();let code=codeForm.code.value.trim(),role=codeForm.role.value;if(!/^\d{6}$/.test(code)){alert('The code must contain exactly 6 numbers.');return}let {data,error}=await sb.rpc('verify_role_signup_code',{role_input:role,code_input:code});if(error||!data){alert('Incorrect registration code for '+role+'.');return}signupDetails(role,code)};
}
function signupDetails(requestedRole,verifiedCode){
 openModal('Create '+requestedRole+' Account',`<div class="sub" style="margin-bottom:14px">Requested role: <b>${esc(requestedRole)}</b>. Management roles are finalized securely by the server.</div><form id="signupForm">${formField('displayName')}${formField('username')}${formField('email','','email')}${formField('password','','password')}<button class="btn primary full">Create Account</button></form>`);
 signupForm.onsubmit=async e=>{e.preventDefault();let f=signupForm;let {data,error}=await sb.auth.signUp({email:f.email.value.trim(),password:f.password.value,options:{data:{username:f.username.value.trim(),display_name:f.displayName.value.trim(),requested_role:requestedRole,registration_code:verifiedCode}}});if(error){alert(error.message);return}if(!data.session){closeModal();alert('Account created. Check your email if confirmation is enabled. The server will finalize the selected role after verification.');return}await finishAuth(data.user);closeModal();enter()};

function cropImageFile(file,aspect=1){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{
   const source=new Image();source.onerror=reject;source.onload=()=>{
    const overlay=document.createElement('div');overlay.style.cssText='position:fixed;inset:0;background:#07090d;z-index:9999;display:flex;align-items:center;justify-content:center;padding:18px';
    overlay.innerHTML=`<div style="width:min(96vw,560px);display:flex;flex-direction:column;gap:12px"><div style="display:flex;justify-content:space-between;align-items:center"><button id="cropCancel" class="btn ghost">Cancel</button><b>Adjust Photo</b><button id="cropDone" class="btn primary">Use Photo</button></div><div id="cropStage" style="width:100%;aspect-ratio:${aspect};position:relative;overflow:hidden;background:#000;border-radius:20px;touch-action:none"><img id="cropImg" src="${reader.result}" draggable="false" style="position:absolute;left:50%;top:50%;max-width:none;user-select:none;pointer-events:none"><div style="position:absolute;inset:0;border:2px solid rgba(255,255,255,.85);border-radius:20px;pointer-events:none"></div></div><div class="sub" style="text-align:center">Drag to reposition • Pinch to zoom</div><div style="display:flex;gap:8px"><button id="cropReset" class="btn ghost" style="flex:1">Reset</button><button id="cropMinus" class="btn ghost">−</button><button id="cropPlus" class="btn ghost">＋</button></div></div>`;
    document.body.appendChild(overlay);const stage=overlay.querySelector('#cropStage'),im=overlay.querySelector('#cropImg');let scale=1,x=0,y=0,last=null,pinch=null;
    const fit=()=>{const r=stage.getBoundingClientRect();scale=Math.max(r.width/source.width,r.height/source.height);x=0;y=0;draw()};
    const draw=()=>{im.style.width=source.width+'px';im.style.height=source.height+'px';im.style.transform=`translate(-50%,-50%) translate(${x}px,${y}px) scale(${scale})`};
    const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
    stage.ontouchstart=e=>{e.preventDefault();if(e.touches.length===1)last={x:e.touches[0].clientX,y:e.touches[0].clientY};if(e.touches.length===2)pinch={d:dist(e.touches),s:scale}};
    stage.ontouchmove=e=>{e.preventDefault();if(e.touches.length===1&&last){x+=e.touches[0].clientX-last.x;y+=e.touches[0].clientY-last.y;last={x:e.touches[0].clientX,y:e.touches[0].clientY};draw()}else if(e.touches.length===2&&pinch){scale=Math.max(.03,pinch.s*dist(e.touches)/pinch.d);draw()}};
    stage.ontouchend=()=>{last=null;pinch=null};
    overlay.querySelector('#cropMinus').onclick=()=>{scale*=.9;draw()};overlay.querySelector('#cropPlus').onclick=()=>{scale*=1.1;draw()};overlay.querySelector('#cropReset').onclick=fit;
    overlay.querySelector('#cropCancel').onclick=()=>{overlay.remove();resolve(null)};
    overlay.querySelector('#cropDone').onclick=()=>{const r=stage.getBoundingClientRect(),outW=Math.min(1200,Math.max(500,Math.round(r.width*2))),outH=Math.round(outW/aspect),factor=outW/r.width,c=document.createElement('canvas');c.width=outW;c.height=outH;const ctx=c.getContext('2d');ctx.translate(outW/2+x*factor,outH/2+y*factor);ctx.scale(scale*factor,scale*factor);ctx.drawImage(source,-source.width/2,-source.height/2);const data=c.toDataURL('image/jpeg',.88);overlay.remove();resolve(data)};
    requestAnimationFrame(fit);
   };source.src=reader.result;
  };reader.readAsDataURL(file);
 });
}
async function prepareCropInput(input,aspect=1,previewId=''){
 const file=input?.files?.[0];if(!file)return null;
 const data=await cropImageFile(file,aspect);
 if(!data){input.value='';delete input.dataset.cropped;return null}
 input.dataset.cropped=data;
 if(previewId){
  const old=document.getElementById(previewId);
  if(old){const im=document.createElement('img');im.id=previewId;im.className='thumb';im.style.cssText='width:84px;height:84px;object-fit:cover';im.src=data;old.replaceWith(im)}
 }
 return data;
}

function daysSince(d){if(!d)return 0;let a=new Date(d+'T00:00:00'),b=new Date();a.setHours(0,0,0,0);b.setHours(0,0,0,0);return Math.max(0,Math.floor((b-a)/86400000)+1)}
function mdy(d){if(!d)return '—';let p=d.split('-');if(p.length!==3)return d;return `${Number(p[1])}/${Number(p[2])}/${p[0]}`}

function activeChampionFor(titleId){return db.champions.find(c=>c.titleId===titleId)}
function reignDays(start,end){
 if(!start)return 0;
 const a=new Date(start+'T00:00:00');
 const b=end?new Date(end+'T00:00:00'):new Date();
 return Math.max(0,Math.floor((b-a)/86400000));
}
function reignTime(start,end){
 const d=reignDays(start,end);
 if(d<1)return '<1 DAY';
 return `${d} ${d===1?'DAY':'DAYS'}`;
}
function champList(actions=true){let currentTitles=db.championships.map(t=>({t,c:activeChampionFor(t.id)})).filter(x=>x.c);return `<div class="titleGrid">${currentTitles.map(({t,c})=>{let s=db.superstars.find(x=>x.id===c.superstarId);return `<div class="titleCard" onclick="championshipHistory('${t.id}')">${(c.image||s?.image)?`<img src="${esc(c.image||s.image)}">`:`<div class="avatar" style="width:100%;height:100%;border-radius:0;font-size:72px">${esc(s?.name?.[0]||'?')}</div>`}<div class="shade"></div><div class="info"><span class="badge gold">CHAMPION</span><h3>${esc(s?.name||'Unknown Superstar')}</h3><div class="titleName">${esc(t.name)}</div><div class="sub">${mdy(c.dateWon)} – PRESENT</div><div class="days" style="font-size:18px;margin-top:3px">${reignTime(c.dateWon)}</div>${actions&&canEdit()?`<div style="margin-top:11px;display:flex;gap:7px;flex-wrap:wrap"><button class="btn small blue" onclick="event.stopPropagation();editChampion('${c.id}')">✎ Edit Champion</button><button class="btn small danger" onclick="event.stopPropagation();deleteChampion('${c.id}')">− Delete Champion</button></div>`:''}</div></div>`}).join('')||empty()}</div>`}

function championshipHistory(titleId){
 const t=db.championships.find(x=>x.id===titleId); const c=activeChampionFor(titleId); const s=c?db.superstars.find(x=>x.id===c.superstarId):null;
 let hist=(db.championHistory||[]).filter(h=>h.titleId===titleId).sort((a,b)=>(b.dateWon||'').localeCompare(a.dateWon||''));
 let rows=[];
 if(c)rows.push({id:c.id,name:s?.name||'Unknown Superstar',dateWon:c.dateWon,dateLost:'',current:true,notes:c.notes||''});
 hist.forEach(h=>rows.push({id:h.id,name:h.superstarName||db.superstars.find(x=>x.id===h.superstarId)?.name||'Unknown Superstar',dateWon:h.dateWon,dateLost:h.dateLost,current:false,notes:h.notes||''}));
 view.innerHTML=`<div class="sectionHead"><div><button class="btn ghost small" onclick="go('Champions')">← Champions</button><h2 style="margin-top:12px">${esc(t?.name||'Championship')}</h2><div class="sub">Championship history</div></div></div>${c?`<div class="historyHero">${(c.image||s?.image)?`<img src="${esc(c.image||s.image)}">`:''}<div class="shade"></div><div class="copy"><span class="badge gold">CURRENT CHAMPION</span><h1>${esc(s?.name||'Unknown Superstar')}</h1><div>${mdy(c.dateWon)} – PRESENT</div><div class="days" style="font-size:20px;margin-top:4px">${reignTime(c.dateWon)}</div>${c.notes?`<div style="margin-top:10px;line-height:1.45">${esc(c.notes)}</div>`:''}</div></div>`:''}<div class="historyList">${rows.map(r=>`<div class="historyRow"><div class="historyName">${esc(r.name)}</div><div class="historyDates">${mdy(r.dateWon)}${r.current?' - PRESENT':` - ${mdy(r.dateLost)}`}</div><div class="historyDays">${reignTime(r.dateWon,r.dateLost)}</div>${r.notes?`<div style="margin-top:13px;font-size:15px;line-height:1.5;color:#333">${esc(r.notes)}</div>`:''}${canEdit()&&!r.current?`<div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:13px"><button class="btn small blue" onclick="editHistory('${r.id}','${titleId}')">✎ Edit History</button><button class="btn small danger" onclick="deleteHistory('${r.id}','${titleId}')">− Delete History</button></div>`:''}</div>`).join('')||`<div class="historyRow">No championship history yet.</div>`}</div>`;
}

function fileToDataURL(file){
 return new Promise((resolve,reject)=>{
  if(!file){resolve('');return}
  const r=new FileReader();
  r.onload=()=>resolve(r.result);
  r.onerror=reject;
  r.readAsDataURL(file);
 });
}

 let o=db.superstars.find(x=>x.id===id)||{};
 let fields=['name','nickname','brand','status','finisher','signature','theme','debut','height','weight','wins','losses'];
 openModal(id?'Edit Superstar':'Add Superstar',`<form id="sform">${photoField(o.image||'','SUPERSTAR PHOTO')}<div class="two">${fields.map(f=>formField(f,o[f]??'',['wins','losses'].includes(f)?'number':'text')).join('')}</div><button class="btn primary full">Save Superstar</button></form>`);
 bindPhotoPreview();
 sform.onsubmit=async e=>{e.preventDefault();let x=id?o:{id:uid('s')};fields.forEach(f=>x[f]=sform.elements[f].value.trim());const file=document.getElementById('photoFile')?.files?.[0];x.image=file?(document.getElementById('photoFile').dataset.cropped||await prepareCropInput(document.getElementById('photoFile'),1)):(o.image||'');if(!id)db.superstars.push(x);const ok=await save('superstars',x.id,id?'edit':'new');if(!ok){await loadOnlineData();render();return}closeModal();render()};
}
async function manageSuperstar(id){
 if(!isOwner())return;let s=db.superstars.find(x=>x.id===id),m=(db.superstarManagement||[]).find(x=>x.superstar_id===id)||{};
 const arr=v=>Array.isArray(v)?v:[];let attendance=arr(m.attendance),warnings=arr(m.warnings),transfers=arr(m.transfers),gallery=arr(m.gallery);
 openModal('Manage '+s.name,`<form id="smForm">
 <div class="field"><label>AVAILABILITY</label><select name="availability">${['Active','Inactive','Injured','Suspended','Part-Time','Released'].map(v=>`<option ${m.availability===v?'selected':''}>${v}</option>`).join('')}</select></div>
 <div class="settingsGroup"><h3>Attendance</h3><div class="two">${formField('attDate',new Date().toISOString().slice(0,10),'date')}<div class="field"><label>STATUS</label><select name="attStatus"><option>Present</option><option>Absent</option><option>Excused</option></select></div></div>${attendance.slice().reverse().map(x=>`<div class="row"><b>${esc(x.date||'')}</b><span class="badge">${esc(x.status||'')}</span></div>`).join('')||empty()}<button type="button" id="addAttendance" class="btn small">+ Attendance</button></div>
 <div class="settingsGroup"><h3>Warnings / Strikes</h3>${formField('warningReason')}<div class="two">${formField('warningDate',new Date().toISOString().slice(0,10),'date')}<div class="field"><label>TYPE</label><select name="warningType"><option>Warning</option><option>Strike</option></select></div></div>${warnings.slice().reverse().map(x=>`<div class="row"><div><b>${esc(x.type||'Warning')}</b><div class="sub">${esc(x.reason||'')} · ${esc(x.date||'')}</div></div></div>`).join('')||empty()}<button type="button" id="addWarning" class="btn small">+ Warning / Strike</button></div>
 <div class="settingsGroup"><h3>Brand Transfer</h3><div class="two"><div class="field"><label>FROM</label><select name="fromBrand"><option>RAW</option><option>SmackDown</option><option>NXT</option><option>Unassigned</option></select></div><div class="field"><label>TO</label><select name="toBrand"><option>RAW</option><option>SmackDown</option><option>NXT</option><option>Unassigned</option></select></div></div>${formField('transferDate',new Date().toISOString().slice(0,10),'date')}${transfers.slice().reverse().map(x=>`<div class="row"><div><b>${esc(x.from||'')} → ${esc(x.to||'')}</b><div class="sub">${esc(x.date||'')}</div></div></div>`).join('')||empty()}<button type="button" id="addTransfer" class="btn small">+ Transfer</button></div>
 <div class="settingsGroup"><h3>Gallery</h3><div class="sub">Additional image URLs for this Superstar.</div>${formField('galleryUrl')}<button type="button" id="addGallery" class="btn small">+ Add Image</button><div class="superGrid" style="margin-top:10px">${gallery.map(url=>`<img src="${esc(url)}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px">`).join('')}</div></div>
 <button class="btn primary full">Save Management Record</button></form>`);
 const save=async()=>{let row={superstar_id:id,availability:smForm.availability.value,attendance,warnings,transfers,gallery};let r=m.id?await sb.from('superstar_management').update(row).eq('id',m.id):await sb.from('superstar_management').insert(row);if(r.error){alert(r.error.message);return false}if(!m.id){await loadOnlineData();m=(db.superstarManagement||[]).find(x=>x.superstar_id===id)||m}return true};
 addAttendance.onclick=async()=>{attendance.push({date:smForm.attDate.value,status:smForm.attStatus.value});if(await save())manageSuperstar(id)};
 addWarning.onclick=async()=>{if(!smForm.warningReason.value.trim())return;warnings.push({date:smForm.warningDate.value,type:smForm.warningType.value,reason:smForm.warningReason.value.trim()});if(await save())manageSuperstar(id)};
 addTransfer.onclick=async()=>{let from=smForm.fromBrand.value,to=smForm.toBrand.value;transfers.push({date:smForm.transferDate.value,from,to});if(await save()){let r=await sb.from('superstars').update({brand:to}).eq('id',id);if(r.error)return alert(r.error.message);await onlineActivity('Transferred '+s.name+' from '+from+' to '+to);await loadOnlineData();manageSuperstar(id)}};
 addGallery.onclick=async()=>{let u=smForm.galleryUrl.value.trim();if(u){gallery.push(u);if(await save())manageSuperstar(id)}};
 smForm.onsubmit=async e=>{e.preventDefault();if(await save()){await onlineActivity('Updated management record for '+s.name);await loadOnlineData();closeModal();profile(id)}};
}

function profile(id){let s=db.superstars.find(x=>x.id===id);openModal(s.name,`<div class="profile">${s.image?`<img src="${esc(s.image)}">`:`<div class="avatar" style="width:130px;height:160px;border-radius:16px;font-size:45px">${esc(s.name[0])}</div>`}<div><span class="badge red">${esc(s.brand||'Unassigned')}</span><h2 style="margin-top:8px">${esc(s.name)}</h2><div class="muted">${esc(s.nickname||'WWE Superstar')}</div>${isOwner()?`<button class="btn small blue" style="margin-top:10px" onclick="closeModal();manageSuperstar('${s.id}')">Manage Superstar</button>`:''}<div class="kv">${[['Status',s.status],['Finisher',s.finisher],['Signature',s.signature],['Theme Song',s.theme],['Debut',s.debut],['Height',s.height],['Weight',s.weight],['Record',`${s.wins||0}-${s.losses||0}`],['Current Titles',db.champions.filter(c=>c.superstarId===s.id).map(c=>db.championships.find(t=>t.id===c.titleId)?.name).filter(Boolean).join(', ')||'None'],['Recorded Reigns',db.championHistory.filter(x=>x.superstarId===s.id||x.superstarName===s.name).length]].map(x=>`<div><b>${x[0]}</b>${esc(x[1]||'—')}</div>`).join('')}</div></div></div>`)}
async function vacateChampionship(titleId){
 if(!canEdit()||!confirm('Vacate this championship? The current reign will be archived.'))return;
 let c=db.champions.find(x=>x.titleId===titleId);if(!c)return;
 let st=db.superstars.find(x=>x.id===c.superstarId);
 let hist={superstar_id:c.superstarId,superstar_name:st?.name||'',title_id:c.titleId,date_won:c.dateWon,date_lost:new Date().toISOString().slice(0,10),image:c.image||null,notes:'Championship vacated'};
 let a=await sb.from('champion_history').insert(hist);if(a.error)return alert(a.error.message);
 let d=await sb.from('champions').delete().eq('id',c.id);if(d.error)return alert(d.error.message);
 await sb.from('championships').update({status:'VACANT'}).eq('id',titleId);await onlineActivity('Vacated championship');await loadOnlineData();render();
}
async function deleteChampion(id){
 const c=db.champions.find(x=>x.id===id); if(!c)return;
 const st=db.superstars.find(x=>x.id===c.superstarId);
 if(!confirm(`Delete ${st?.name||'this champion'} as current champion? It will be permanently deleted after Save Changes in Settings.`))return;
 pendingDeletes.push({table:'champions',id});
 db.champions=db.champions.filter(x=>x.id!==id);
 markUnsaved();render();
}
function editChampion(id=''){
 let o=db.champions.find(x=>x.id===id)||{};
 openModal(id?'Edit Champion':'Set New Champion',`<form id="cform">${photoField(o.image||'','CHAMPION PHOTO')}<div class="field"><label>SUPERSTAR</label><select name="superstarId">${db.superstars.map(s=>`<option value="${s.id}" ${o.superstarId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>CHAMPIONSHIP</label><select name="titleId">${db.championships.map(t=>`<option value="${t.id}" ${o.titleId===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div>${formField('dateWon',o.dateWon||new Date().toISOString().slice(0,10))}${formField('notes',o.notes||'')}<div class="sub" style="margin:-5px 0 14px">Optional: write who they defeated, PPV/event, location, match details, etc.</div><button class="btn primary full">Save Champion</button></form>`);
 bindPhotoPreview();
 cform.onsubmit=async e=>{
  e.preventDefault();
  const superstarId=cform.superstarId.value,titleId=cform.titleId.value,dateWon=cform.dateWon.value;
  const file=document.getElementById('photoFile')?.files?.[0];
  if(id){
   o.superstarId=superstarId;o.titleId=titleId;o.dateWon=dateWon;o.notes=cform.notes.value.trim();if(file)o.image=document.getElementById('photoFile').dataset.cropped||await prepareCropInput(document.getElementById('photoFile'),1);
  }else{
   const previous=db.champions.find(x=>x.titleId===titleId);
   if(previous){
    const ps=db.superstars.find(x=>x.id===previous.superstarId);
    db.championHistory.push({id:uid('h'),titleId,superstarId:previous.superstarId,superstarName:ps?.name||'',dateWon:previous.dateWon,dateLost:dateWon,image:previous.image||ps?.image||'',notes:previous.notes||''});
    pendingDeletes.push({table:'champions',id:previous.id});db.champions=db.champions.filter(x=>x.id!==previous.id);
   }
   db.champions.push({id:uid('c'),superstarId,titleId,dateWon,notes:cform.notes.value.trim(),image:file?(document.getElementById('photoFile').dataset.cropped||await prepareCropInput(document.getElementById('photoFile'),1)):''});
  }
  if(!id){
   const newest=db.champions[db.champions.length-1];
   if(newest)markUnsaved('champions',newest.id,'new');
   const hist=db.championHistory[db.championHistory.length-1];
   if(hist)markUnsaved('champion_history',hist.id,'new');
  }else markUnsaved('champions',o.id,'edit');
  const ok=true;if(!ok){await loadOnlineData();render();return}closeModal();render();
 };
}
function editUser(id=''){
 let o=db.users.find(x=>x.id===id);if(!o)return;
 openModal('Edit Account',`<form id="uform">${formField('displayName',o.displayName||'')}${formField('username',o.username||'')}<div class="field"><label>ROLE</label><select name="role">${['WxRC Owner','WxRC Admin','WxRC Staff','WxRC Superstar'].map(r=>`<option ${o.role===r?'selected':''}>${r}</option>`).join('')}</select></div><div class="field"><label>LINKED SUPERSTAR</label><select name="superstarId"><option value="">None</option>${db.superstars.map(s=>`<option value="${s.id}" ${o.superstarId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><button class="btn primary full">Save Account</button></form>`);
 uform.onsubmit=async e=>{e.preventDefault();let patch={display_name:uform.displayName.value.trim(),username:uform.username.value.trim(),role:uform.role.value,superstar_id:uform.superstarId.value||null};Object.assign(o,{displayName:patch.display_name,username:patch.username,role:patch.role,superstarId:patch.superstar_id||''});markUnsaved('profiles',o.id,'edit');closeModal();renderNav();render()};
}
function editTransaction(){openModal('WWE Coins Transaction',`<form id="tform">${formField('person')}${formField('amount','0','number')}${formField('note')}${formField('date',new Date().toISOString().slice(0,10))}<button class="btn primary full">Save Transaction</button></form>`);tform.onsubmit=e=>{e.preventDefault();const x={id:uid('tr'),person:tform.person.value.trim(),amount:Number(tform.amount.value),note:tform.note.value.trim(),date:tform.date.value};db.transactions.push(x);save('transactions',x.id,'new');closeModal();render()}}
async function del(key,id){
 if(!canEdit()||!confirm('Delete this item? It will be permanently deleted after Save Changes in Settings.'))return;
 const table=tableMap[key];
 if(table)pendingDeletes.push({table,id});
 db[key]=db[key].filter(x=>x.id!==id);
 markUnsaved();render();
}

(async()=>{const {data:{session}}=await sb.auth.getSession();if(session?.user){if(await finishAuth(session.user))enter()}})();

if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
