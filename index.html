<script>
// Saved locally so each device can use its preferred layout independently.
function wxrcGetDeviceLayout(){try{return localStorage.getItem('wxrc-device-layout')||'automatic'}catch(e){return 'automatic'}}
function wxrcSetDeviceLayout(value){
 if(!['automatic','mobile','pc'].includes(value))return;
 try{localStorage.setItem('wxrc-device-layout',value)}catch(e){}
 wxrcApplyDeviceLayout();
}
function wxrcApplyDeviceLayout(){
 const value=wxrcGetDeviceLayout();
 if(value==='automatic')document.documentElement.removeAttribute('data-wxrc-device');
 else document.documentElement.setAttribute('data-wxrc-device',value);
}
wxrcApplyDeviceLayout();
</script>

async function loadOnlineData(){
 if(!initSupabase())return [];

  ['superstars','superstars','created_at'],

 ];
 const results=await Promise.all(specs.map(async ([table,kind,order])=>{

 }));
 for(const r of results){

  else if(r.table==='champion_history')db.championHistory=mapRows(r.data,'history');
  else if(r.table==='shows')db.shows=mapRows(r.data,'shows');
  else if(r.table==='news')db.news=r.data.map(x=>({id:x.id,title:x.title||'',content:x.content||'',author:x.author||'',image:x.image||'',publishedAt:x.published_at||x.created_at||''}));
  else if(r.table==='announcements')db.announcements=r.data||[];
  else if(r.table==='awards')db.awards=r.data||[];
  else if(r.table==='hall_of_fame')db.hallOfFame=r.data||[];
  else if(r.table==='superstar_achievements')ext.achievements=(r.data||[]).map(x=>({id:x.id,superstarId:x.superstar_id,name:x.name||'',count:Number(x.reign_count||1),date:x.achievement_date||''}));
  else if(r.table==='superstar_injuries')ext.injuries=(r.data||[]).map(x=>({id:x.id,superstarId:x.superstar_id,reason:x.reason||'',from:x.out_since||'',expected:x.expected_return||'',returned:x.returned_on||''}));
  else if(r.table==='superstar_career_highlights')db.careerHighlights=(r.data||[]).map(x=>({id:x.id,superstar_id:x.superstar_id,title_id:x.title_id||'',name:x.name||'',reign_count:Number(x.reign_count||1),hidden:!!x.hidden}));
 }
 if(current && isManagement()){
  const extra=await Promise.allSettled([
   sb.from('profiles').select('*'),
   sb.from('transactions').select('*').order('created_at'),
   sb.from('gimmick_submissions').select('*').order('created_at'),
   sb.from('activity_log').select('*').order('created_at',{ascending:false}).limit(100),
   sb.from('superstar_management').select('*'),
   sb.from('show_matches').select('*').order('created_at'),
   sb.from('admin_permissions').select('*'),
   sb.from('app_settings').select('*').eq('id',1).maybeSingle()
  ]);
  const vals=extra.map(x=>x.status==='fulfilled'?x.value:null);
  if(vals[0]&&!vals[0].error)db.users=mapRows(vals[0].data,'profiles');
  if(vals[1]&&!vals[1].error)db.transactions=mapRows(vals[1].data,'transactions');
  if(vals[2]&&!vals[2].error)db.gimmickSubmissions=mapRows(vals[2].data,'gimmicks');

let saveInProgress=null;
async function commitAllChanges(){
 if(!canEdit())return false;
 if(saveInProgress)return await saveInProgress;
 saveInProgress=(async()=>{
  const rowFor=(table,id)=>{
   if(table==='profiles'){const x=db.users.find(v=>v.id===id);return x&&{username:x.username,display_name:x.displayName,role:x.role,superstar_id:x.superstarId||null}}
   if(table==='superstars'){const x=db.superstars.find(v=>v.id===id);return x&&{id:x.id,name:x.name,nickname:x.nickname||null,brand:x.brand||null,status:x.status||null,finisher:x.finisher||null,signature:x.signature||null,theme:x.theme||null,debut:x.debut||null,height:x.height||null,weight:x.weight||null,wins:Number(x.wins||0),losses:Number(x.losses||0),image:x.image||null}}
   if(table==='championships'){const x=db.championships.find(v=>v.id===id);return x&&{id:x.id,name:x.name,brand:x.brand||null,status:x.status||null,image:x.image||null}}
   if(table==='champions'){const x=db.champions.find(v=>v.id===id);return x&&{id:x.id,superstar_id:x.superstarId,title_id:x.titleId,date_won:x.dateWon,image:x.image||null,notes:x.notes||null}}
   if(table==='champion_history'){const x=db.championHistory.find(v=>v.id===id);return x&&{id:x.id,superstar_id:x.superstarId||null,superstar_name:x.superstarName||null,title_id:x.titleId,date_won:x.dateWon,date_lost:x.dateLost||null,image:x.image||null,notes:x.notes||null}}
   if(table==='shows'){const x=db.shows.find(v=>v.id===id);return x&&{id:x.id,name:x.name,show_date:x.date||null,show_time:x.time||null,status:x.status||null,venue:x.venue||null,image:x.image||null}}
   if(table==='transactions'){const x=db.transactions.find(v=>v.id===id);return x&&{id:x.id,person:x.person,amount:Number(x.amount||0),note:x.note||null,transaction_date:x.date||null}}
   return null;
  };
  for(const d of pendingDeletes){
   const r=await sb.from(d.table).delete().eq('id',d.id);
   if(r.error){alert('SAVE FAILED — Delete: '+r.error.message);return false}
  }
  for(const c of pendingChanges){
   if(pendingDeletes.some(d=>d.table===c.table&&d.id===c.id))continue;
   const row=rowFor(c.table,c.id); if(!row)continue;
   let r;
   if(c.table==='profiles')r=await sb.from(c.table).update(row).eq('id',c.id);
   else if(c.kind==='new')r=await sb.from(c.table).insert(row);
   else r=await sb.from(c.table).update(row).eq('id',c.id);
   if(r.error){alert('SAVE FAILED — '+c.table+': '+r.error.message);return false}
  }
  pendingDeletes=[];pendingChanges=[];unsavedChanges=false;
  await loadOnlineData();
  toastMsg('✓ All changes saved');
  await wxrcSendDiscordEvents();
  return true;
 })();
 try{return await saveInProgress}finally{saveInProgress=null}
}

async function wxrcSaveAllAbsences(){

 for(const [star,change] of [...wxrcPendingAbsences]){

  if(lookup.error){errors.push(name+': '+lookup.error.message);continue}
  const ids=(lookup.data||[]).map(x=>x.id);
  let error=null;
  if(change.action==='delete'){
   // Only remove absence records for this date, never strikes or warnings.
   if(ids.length){const r=await sb.from('wxrc_attendance').delete().in('id',ids);error=r.error}
  }else{
   const row={superstar_id:star,record_type:'Absence',reason:change.reason,start_date:change.date,end_date:null,notes:change.notes||''};
   const r=ids.length?await sb.from('wxrc_attendance').update(row).eq('id',ids[0]):await sb.from('wxrc_attendance').insert(row);
   error=r.error;
   // Clean up only duplicate Absence rows for the same Superstar and date.
   if(!error&&ids.length>1){const extra=await sb.from('wxrc_attendance').delete().in('id',ids.slice(1));error=extra.error}
  }

 }
 if(errors.length)alert('Some records could not be saved:\n'+errors.join('\n'));

}

function cropImageFile(file,aspect=1){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{
   const source=new Image();source.onerror=reject;source.onload=()=>{
    const overlay=document.createElement('div');overlay.style.cssText='position:fixed;inset:0;background:#07090d;z-index:9999;display:flex;align-items:center;justify-content:center;padding:18px';
    overlay.innerHTML=`<div style="width:min(96vw,560px);display:flex;flex-direction:column;gap:12px"><div style="display:flex;justify-content:space-between;align-items:center"><button id="cropCancel" class="btn ghost">Cancel</button><b>Adjust Photo</b><button id="cropDone" class="btn primary">Use Photo</button></div><div id="cropStage" style="width:100%;aspect-ratio:${aspect};position:relative;overflow:hidden;background:#000;border-radius:20px;touch-action:none"><img id="cropImg" src="${reader.result}" draggable="false" style="position:absolute;left:50%;top:50%;max-width:none;user-select:none;pointer-events:none"><div style="position:absolute;inset:0;border:2px solid rgba(255,255,255,.85);border-radius:20px;pointer-events:none"></div></div><div class="sub" style="text-align:center">Drag to reposition • Pinch to zoom</div><div style="display:flex;gap:8px"><button id="cropReset" class="btn ghost" style="flex:1">Reset</button><button id="cropMinus" class="btn ghost">−</button><button id="cropPlus" class="btn ghost">＋</button></div></div>`;
    document.body.appendChild(overlay);const stage=overlay.querySelector('#cropStage'),im=overlay.querySelector('#cropImg');let scale=1,x=0,y=0,last=null,pinch=null;
    const fit=()=>{const r=stage.getBoundingClientRect();scale=Math.max(r.width/source.width,r.height/source.height);x=0;y=0;draw()};
    const draw=()=>{im.style.width=source.width+'px';im.style.height=source.height+'px';im.style.transform=`translate(-50%,-50%) translate(${x}px,${y}px) scale(${scale})`};
    const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
    stage.ontouchstart=e=>{e.preventDefault();if(e.touches.length===1)last={x:e.touches[0].clientX,y:e.touches[0].clientY};if(e.touches.length===2)pinch={d:dist(e.touches),s:scale}};
    stage.ontouchmove=e=>{e.preventDefault();if(e.touches.length===1&&last){x+=e.touches[0].clientX-last.x;y+=e.touches[0].clientY-last.y;last={x:e.touches[0].clientX,y:e.touches[0].clientY};draw()}else if(e.touches.length===2&&pinch){scale=Math.max(.03,pinch.s*dist(e.touches)/pinch.d);draw()}};
    stage.ontouchend=()=>{last=null;pinch=null};
    overlay.querySelector('#cropMinus').onclick=()=>{scale*=.9;draw()};overlay.querySelector('#cropPlus').onclick=()=>{scale*=1.1;draw()};overlay.querySelector('#cropReset').onclick=fit;
    overlay.querySelector('#cropCancel').onclick=()=>{overlay.remove();resolve(null)};
    overlay.querySelector('#cropDone').onclick=()=>{const r=stage.getBoundingClientRect(),outW=Math.min(1200,Math.max(500,Math.round(r.width*2))),outH=Math.round(outW/aspect),factor=outW/r.width,c=document.createElement('canvas');c.width=outW;c.height=outH;const ctx=c.getContext('2d');ctx.translate(outW/2+x*factor,outH/2+y*factor);ctx.scale(scale*factor,scale*factor);ctx.drawImage(source,-source.width/2,-source.height/2);const data=c.toDataURL('image/jpeg',.88);overlay.remove();resolve(data)};
    requestAnimationFrame(fit);
   };source.src=reader.result;
  };reader.readAsDataURL(file);
 });
}
async function prepareCropInput(input,aspect=1,previewId=''){

  if(old){const im=document.createElement('img');im.id=previewId;im.className='thumb';im.style.cssText='width:84px;height:84px;object-fit:cover';im.src=data;old.replaceWith(im)}
 }
 return data;
}

function mdy(d){if(!d)return '—';let p=d.split('-');if(p.length!==3)return d;return `${Number(p[1])}/${Number(p[2])}/${p[0]}`}

// Discord announcements are queued locally and sent only after Supabase saves succeed.
let wxrcDiscordEvents=[];
function wxrcQueueDiscord(titleId,previousId,newId,reason=''){
 const title=db.championships.find(t=>t.id===titleId);
 if(!title || previousId===newId)return;
 wxrcDiscordEvents=wxrcDiscordEvents.filter(e=>e.titleId!==titleId);
 wxrcDiscordEvents.push({eventId:crypto.randomUUID(),titleId,previousId:previousId||null,newId:newId||null,reason:reason||null});
}
async function wxrcSendDiscordEvents(){
 if(!wxrcDiscordEvents.length)return;
 const events=[...wxrcDiscordEvents];
 for(const event of events){
  try{
   const {data,error}=await sb.functions.invoke('championship-discord',{body:event});
   if(error || !data?.ok)throw Error(error?.message||data?.error||'Discord delivery failed');
   wxrcDiscordEvents=wxrcDiscordEvents.filter(e=>e.eventId!==event.eventId);
  }catch(err){console.error('Discord announcement pending',err);toastMsg('Saved, but Discord notification failed. Contact an administrator.');}
 }
}
function wxrcChampionHistory(c,dateLost){
 const superstar=db.superstars.find(s=>s.id===c.superstarId);
 const h={id:uid('h'),superstarId:c.superstarId,superstarName:superstar?.name||'Unknown Superstar',titleId:c.titleId,dateWon:c.dateWon,dateLost, image:c.image||'',notes:c.notes||''};
 db.championHistory.push(h);markUnsaved('champion_history',h.id,'new');
}
function editChampion(id=''){
 if(!canEdit())return;
 const existing=db.champions.find(c=>c.id===id);
 const options=db.championships.map(t=>`<option value="${esc(t.id)}" ${existing?.titleId===t.id?'selected':''}>${esc(t.name)}</option>`).join('');
 const stars=db.superstars.map(st=>`<option value="${esc(st.id)}" ${existing?.superstarId===st.id?'selected':''}>${esc(st.name)}${/^(VACANT|VACATE) CHAMPIONSHIP$/i.test(String(st.name||"").trim()) && /^(Male|Female)$/i.test(String(st.nickname||"").trim())?" — "+esc(st.nickname):""}</option>`).join('');
 if(!options||!stars)return alert('Create a Championship and Superstar first.');
 openModal(existing?'Edit Champion':'Set New Champion',`<form id="champForm"><div class="field"><label>CHAMPIONSHIP</label><select name="titleId" required>${options}</select></div><div class="field"><label>SUPERSTAR</label><select name="superstarId" required>${stars}</select></div>${formField('dateWon',existing?.dateWon||new Date().toISOString().slice(0,10),'date')}${formField('notes',existing?.notes||'')}<button class="btn primary full">Save Champion</button></form>`);
 champForm.onsubmit=e=>{
  e.preventDefault();const f=champForm,titleId=f.titleId.value,starId=f.superstarId.value,dateWon=f.dateWon.value;
  if(!dateWon)return alert('Choose a date.');
  const chosen=db.superstars.find(x=>x.id===starId);
  const nick=String(chosen?.nickname||'').trim().toUpperCase();
  const displayName=String(chosen?.name||'').trim().toUpperCase();
  // The two Vacant Championship Superstars are distinguished by Nickname: Male / Female.
  const isVacantPlaceholder=(x)=>/^(VACANT|VACATE) CHAMPIONSHIP$/i.test(String(x?.name||'').trim()) && /^(MALE|FEMALE)$/i.test(String(x?.nickname||'').trim());
  const vacateKind=/^(VACANT|VACATE) CHAMPIONSHIP$/i.test(displayName) && /^(MALE|FEMALE)$/.test(nick) ? nick.toLowerCase() : null;
  if(vacateKind){
   const title=db.championships.find(x=>x.id===titleId);
   const isFemale=/women[’']?s/i.test(title?.name||'');
   if(vacateKind!=='any' && (vacateKind==='female')!==isFemale){alert('Choose Vacant Championship with Nickname Male for men’s titles or Female for Women’s titles.');return;}
   const holder=activeChampionFor(titleId);
   if(!holder){alert('Championship is already vacant.');return;}
   if(!confirm('Vacate '+title.name+'?'))return;
   const oldStar=db.superstars.find(x=>x.id===holder.superstarId);
   // Placeholder records are not real reigns and must not enter championship history.
   if(!isVacantPlaceholder(oldStar))wxrcChampionHistory(holder,dateWon);
   db.champions=db.champions.filter(x=>x.id!==holder.id);
   pendingChanges=pendingChanges.filter(x=>!(x.table==='champions'&&x.id===holder.id));
   pendingDeletes.push({table:'champions',id:holder.id});
   unsavedChanges=true;
   wxrcQueueDiscord(titleId,isVacantPlaceholder(oldStar)?null:holder.superstarId,null,'Vacated via '+(chosen.nickname||chosen.name));
   saveDataCache();closeModal();champions();toastMsg('Championship vacated — save in Settings to publish');
   return;
  }
  const currentHolder=activeChampionFor(titleId);
  const prevStar=db.superstars.find(x=>x.id===currentHolder?.superstarId);
  const prevId=isVacantPlaceholder(prevStar)?null:(currentHolder?.superstarId||null);
  if(existing && existing.titleId!==titleId){alert('To move a champion to another title, vacate the old title first.');return;}
  if(currentHolder && currentHolder.id!==existing?.id){if(prevId)wxrcChampionHistory(currentHolder,dateWon);db.champions=db.champions.filter(c=>c.id!==currentHolder.id);pendingChanges=pendingChanges.filter(c=>!(c.table==='champions'&&c.id===currentHolder.id));pendingDeletes.push({table:'champions',id:currentHolder.id});}
  if(existing && existing.superstarId!==starId){if(prevId)wxrcChampionHistory(existing,dateWon);existing.superstarId=starId;existing.dateWon=dateWon;existing.notes=f.notes.value.trim();markUnsaved('champions',existing.id,'edit');}
  else if(existing){existing.dateWon=dateWon;existing.notes=f.notes.value.trim();markUnsaved('champions',existing.id,'edit');}
  else {const item={id:uid('c'),titleId,superstarId:starId,dateWon,notes:f.notes.value.trim(),image:''};db.champions.push(item);markUnsaved('champions',item.id,'new');}
  if(prevId!==starId)wxrcQueueDiscord(titleId,prevId,starId);
  saveDataCache();closeModal();champions();
 };
}
function vacateChampionship(titleId){
 if(!canEdit())return;const c=activeChampionFor(titleId);if(!c)return;
 const title=db.championships.find(t=>t.id===titleId);
 openModal('Vacate Championship',`<div class="sub">${esc(title?.name||'Championship')}</div><form id="vacateForm"><div class="field"><label>REASON</label><select name="reason"><option>Injury</option><option>Retirement</option><option>Suspension</option><option>Other</option></select></div><div class="field hidden" id="vacateOtherWrap"><label>OTHER REASON</label><input name="other" maxlength="200"></div><button class="btn danger full">Confirm Vacate Championship</button></form>`);
 vacateForm.reason.onchange=()=>vacateOtherWrap.classList.toggle('hidden',vacateForm.reason.value!=='Other');
 vacateForm.onsubmit=e=>{e.preventDefault();const reason=vacateForm.reason.value==='Other'?vacateForm.other.value.trim():vacateForm.reason.value;if(!reason)return alert('Enter a reason.');if(!confirm('Vacate this championship?'))return;
  wxrcChampionHistory(c,new Date().toISOString().slice(0,10));db.champions=db.champions.filter(x=>x.id!==c.id);pendingChanges=pendingChanges.filter(x=>!(x.table==='champions'&&x.id===c.id));pendingDeletes.push({table:'champions',id:c.id});unsavedChanges=true;wxrcQueueDiscord(titleId,c.superstarId,null,reason);saveDataCache();closeModal();champions();toastMsg('Vacated locally — save in Settings to publish');};
}
function deleteChampion(id){
 if(!canEdit())return;const c=db.champions.find(x=>x.id===id);if(!c)return;
 if(!confirm('Remove this champion? This will vacate the title.'))return;
 editChampion(c.id);
}

function activeChampionFor(titleId){return db.champions.find(c=>c.titleId===titleId)}
function reignDays(start,end){
 if(!start)return 0;
 const a=new Date(start+'T00:00:00');
 const b=end?new Date(end+'T00:00:00'):new Date();
 return Math.max(0,Math.floor((b-a)/86400000));
}
function reignTime(start,end){
 const d=reignDays(start,end);
 if(d<1)return '<1 DAY';
 return `${d} ${d===1?'DAY':'DAYS'}`;
}
function champList(actions=true){
 const titles=db.championships.map(t=>({t,c:activeChampionFor(t.id)}));
 return `<div class="titleGrid championsSingleColumn">${titles.map(({t,c})=>{
  const isFemale=/women[’']?s/i.test(t.name||'');
  const s=c?db.superstars.find(x=>x.id===c.superstarId):null;
  const vacantStar=!c?db.superstars.find(x=>/^(VACANT|VACATE) CHAMPIONSHIP$/i.test(String(x.name||'').trim()) && String(x.nickname||'').trim().toLowerCase()===(isFemale?'female':'male')):null;
  const vacant=!c;
  const photo=c?(c.image||s?.image):(vacantStar?.image||'');
  const display=vacant?'VACANT CHAMPIONSHIP':(s?.name||'Unknown Superstar');
  return `<div class="titleCard" onclick="championshipHistory('${t.id}')">${photo?`<img loading="lazy" decoding="async" src="${esc(photo)}">`:`<div class="avatar" style="width:100%;height:100%;border-radius:0;font-size:72px">${vacant?'◆':esc(display[0]||'?')}</div>`}<div class="shade"></div><div class="info"><span class="badge ${vacant?'red':'gold'}">${vacant?'VACANT CHAMPIONSHIP':'CHAMPION'}</span><h3>${esc(display)}</h3><div class="titleName">${esc(t.name)}</div>${vacant?`<div class="sub">TITLE CURRENTLY VACANT</div>`:`<div class="sub">${mdy(c.dateWon)} – PRESENT</div><div class="days" style="font-size:18px;margin-top:3px">${reignTime(c.dateWon)}</div>`}${actions&&canEdit()?`<div style="margin-top:11px;display:flex;gap:7px;flex-wrap:wrap"><button class="btn small blue" onclick="event.stopPropagation();editChampion(${c?`'${c.id}'`:''})">${vacant?'+ Set New Champion':'✎ Edit Champion'}</button>${c?`<button class="btn small danger" onclick="event.stopPropagation();deleteChampion('${c.id}')">− Delete Champion</button>`:''}</div>`:''}</div></div>`;
 }).join('')||empty()}</div>`;
}

 const backBtn=document.getElementById('championsBackBtn');
 if(backBtn){

function deleteHistory(id,titleId){

function fileToDataURL(file){
 return new Promise((resolve,reject)=>{
  if(!file){resolve('');return}
  const r=new FileReader();
  r.onload=()=>resolve(r.result);
  r.onerror=reject;
  r.readAsDataURL(file);
 });
}

function manageInjuries(superstarId){
 const s=db.superstars.find(x=>x.id===superstarId);if(!s)return;const rows=injuryFor(superstarId);
 openModal('Injuries · '+s.name,`<form id="injForm"><div class="field"><label>INJURY / REASON</label><input name="reason" required></div><div class="two"><div class="field"><label>OUT SINCE</label><input name="from" type="date" required></div><div class="field"><label>EXPECTED RETURN</label><input name="expected" type="date"></div></div><button class="btn primary full">Add Injury</button></form><div class="settingsGroup"><h3>Injury History</h3>${rows.map(x=>`<div class="row"><div><b>${esc(x.reason)}</b><div class="sub">${esc(x.from)}${x.expected?' · Expected '+esc(x.expected):''}${x.returned?' · Returned '+esc(x.returned):' · ACTIVE'}</div></div><div class="rowActions">${!x.returned?`<button class="btn small blue" onclick="returnFromInjury('${superstarId}','${x.id}')">Returned</button>`:''}<button class="btn small danger" onclick="deleteInjury('${superstarId}','${x.id}')">Delete</button></div></div>`).join('')||empty()}</div>`);
 injForm.onsubmit=async e=>{e.preventDefault();const item={id:uid('inj'),superstarId,reason:injForm.reason.value.trim(),from:injForm.from.value,expected:injForm.expected.value,returned:''};ext.injuries.push(item);saveExt();if(initSupabase()){const r=await sb.from('superstar_injuries').insert({id:item.id,superstar_id:superstarId,reason:item.reason,out_since:item.from,expected_return:item.expected||null});if(r.error)return alert('Supabase: '+r.error.message)}closeModal();manageInjuries(superstarId);toastMsg('Injury saved online')}
}
async function returnFromInjury(superstarId,id){const x=ext.injuries.find(v=>v.id===id);if(!x)return;x.returned=new Date().toISOString().slice(0,10);if(initSupabase()){const r=await sb.from('superstar_injuries').update({returned_on:x.returned}).eq('id',id);if(r.error)return alert('Supabase: '+r.error.message)}saveExt();manageInjuries(superstarId)}
async function deleteInjury(superstarId,id){if(!confirm('Delete this injury record?'))return;if(initSupabase()){const r=await sb.from('superstar_injuries').delete().eq('id',id);if(r.error)return alert('Supabase: '+r.error.message)}ext.injuries=ext.injuries.filter(x=>x.id!==id);saveExt();manageInjuries(superstarId)}
function championshipDetail(id){
 const t=db.championships.find(x=>x.id===id);if(!t)return;const c=db.champions.find(x=>x.titleId===id),cs=c?db.superstars.find(x=>x.id===c.superstarId):null;const hist=(db.championHistory||[]).filter(x=>x.titleId===id);const all=[...hist.map(h=>({name:h.superstarName||superstarName(h.superstarId),from:h.dateWon,to:h.dateLost})),...(c?[{name:cs?.name||'Unknown',from:c.dateWon,to:'Present'}]:[])];
 openModal(t.name,`${t.image?`<img src="${esc(t.image)}" style="width:100%;max-height:260px;object-fit:cover;border-radius:16px;margin-bottom:14px">`:''}<span class="badge gold">${esc(t.brand||'CHAMPIONSHIP')}</span><h2 style="margin:10px 0">${esc(t.name)}</h2><div class="kv"><div><b>Current Champion</b>${esc(cs?.name||'Vacant')}</div><div><b>Status</b>${esc(t.status||'Active')}</div><div><b>Recorded Reigns</b>${all.length}</div><div><b>Current Reign</b>${c?esc(reignTime(c.dateWon)):'—'}</div></div><div class="settingsGroup"><h3>Title History</h3>${all.slice().reverse().map(x=>`<div class="row"><div><b>${esc(x.name)}</b><div class="sub">${esc(x.from||'—')} — ${esc(x.to||'Present')}</div></div></div>`).join('')||empty()}</div><button class="btn full" onclick="closeModal();championshipHistory('${id}')">Open Full Championship History</button>`)
}
function upcomingEventsHTML(){const today=new Date().toISOString().slice(0,10);const rows=(db.shows||[]).filter(x=>(x.date||'')>=today&&String(x.status||'').toLowerCase()!=='completed').sort((a,b)=>(a.date||'').localeCompare(b.date||'')).slice(0,4);return `<div class="settingsGroup"><h3>Upcoming Events</h3>${rows.map(x=>`<div class="row" onclick="showControl('${x.id}')" style="cursor:pointer"><div><b>${esc(x.name)}</b><div class="sub">${esc(x.date||'')} ${esc(x.time||'')} · ${esc(x.venue||'')}</div></div><span class="badge red">UPCOMING</span></div>`).join('')||`<div class="sub">No upcoming events.</div>`}</div>`}
function careerTitleName(name=''){return String(name).replace(/Championship\b/gi,'Champion').trim()}
function careerHighlightsFor(s){
 const counts=new Map();
 const add=(titleId)=>{if(titleId)counts.set(titleId,(counts.get(titleId)||0)+1)};
 // Completed reigns + current reign are always shown automatically.
 (db.championHistory||[]).filter(r=>r.superstarId===s.id||(!r.superstarId&&r.superstarName===s.name)).forEach(r=>add(r.titleId));
 (db.champions||[]).filter(r=>r.superstarId===s.id).forEach(r=>add(r.titleId));
 const manual=(db.careerHighlights||[]).filter(x=>x.superstar_id===s.id&&!x.hidden);
 const out=[];
 counts.forEach((count,titleId)=>{
  const t=db.championships.find(v=>v.id===titleId),m=manual.find(x=>x.title_id===titleId);
  out.push({titleId,name:m?.name||careerTitleName(t?.name||'Championship'),count:Math.max(1,Number(m?.reign_count||count)),overrideId:m?.id||'',automatic:!m});
 });
 manual.filter(m=>!counts.has(m.title_id)).forEach(m=>{const t=db.championships.find(v=>v.id===m.title_id);out.push({titleId:m.title_id||'',name:m.name||careerTitleName(t?.name||'Championship'),count:Math.max(1,Number(m.reign_count||1)),overrideId:m.id||'',automatic:false})});
 return out;
}
function careerHighlightsHTML(s){
 const hs=[...careerHighlightsFor(s),...achievementHighlightsFor(s.id)];
 return `<div style="border-top:1px solid #42484b;margin-top:28px;padding-top:30px;width:100%"><div style="font-size:clamp(18px,4vw,24px);font-weight:400;letter-spacing:.7px;margin-bottom:16px">Career Highlights</div>${hs.length?hs.map(x=>`<div style="font-size:clamp(20px,4.8vw,30px);font-weight:850;line-height:1.18;margin:0 0 12px;overflow-wrap:anywhere">${esc(x.name)}${x.count>1?` (x${x.count})`:''}${canEdit()&&x.achievement?`<div style="margin-top:7px"><button class="btn small danger" onclick="removeAchievement('${s.id}','${x.id}')">Remove</button></div>`:canEdit()&&x.overrideId?`<div style="display:flex;gap:7px;margin-top:7px"><button class="btn small blue" onclick="editCareerHighlight('${s.id}','${x.overrideId}')">Edit</button><button class="btn small danger" onclick="removeCareerHighlight('${s.id}','${x.overrideId}')">Remove</button></div>`:''}</div>`).join(''):`<div class="sub" style="font-size:16px;margin-bottom:12px">No Career Highlights yet.</div>`}${canEdit()?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="btn small" onclick="addCareerHighlight('${s.id}')">+ Championship</button><button class="btn small blue" onclick="addAchievement('${s.id}')">+ Achievement</button></div>`:''}</div>`
}
function editCareerHighlight(superstarId,highlightId){
 const cur=(db.careerHighlights||[]).find(x=>x.id===highlightId);if(!cur)return;
 const titles=(db.championships||[]).slice().sort((a,b)=>(a.name||'').localeCompare(b.name||''));
 openModal('Edit Career Highlight',`<form id="careerForm"><div class="field"><label>CHAMPIONSHIP</label><select name="titleId" required>${titles.map(t=>`<option value="${t.id}" ${t.id===cur.title_id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label>TIMES HELD / COUNT</label><input name="count" type="number" min="1" step="1" value="${Math.max(1,Number(cur.reign_count||1))}" required></div><button class="btn primary full">Save Highlight</button></form>`);
 careerForm.onsubmit=async e=>{e.preventDefault();const titleId=careerForm.elements.namedItem("titleId").value,t=db.championships.find(x=>x.id===titleId),count=Math.max(1,Number(careerForm.elements.namedItem("count").value||1)),name=careerTitleName(t?.name||'Championship');const r=await sb.from('superstar_career_highlights').update({title_id:titleId,name,reign_count:count,hidden:false}).eq('id',highlightId);if(r.error)return alert('Supabase: '+r.error.message);await wxrcRefreshOne("superstar_career_highlights");closeModal();profile(superstarId);toastMsg('Career Highlight saved online')}
}
function addCareerHighlight(superstarId){
 const s=db.superstars.find(x=>x.id===superstarId);if(!s)return;const titles=(db.championships||[]).slice().sort((a,b)=>(a.name||'').localeCompare(b.name||''));if(!titles.length)return alert('No Championships have been created yet.');
 openModal('Add Career Highlight',`<form id="careerPickForm"><div class="field"><label>CHAMPIONSHIP</label><select name="titleId" required>${titles.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label>TIMES HELD / COUNT</label><input name="count" type="number" min="1" step="1" value="1" required></div><button class="btn primary full">Add Highlight</button></form>`);
 careerPickForm.onsubmit=async e=>{e.preventDefault();const titleId=careerPickForm.elements.namedItem("titleId").value,count=Math.max(1,Number(careerPickForm.elements.namedItem("count").value||1)),t=db.championships.find(x=>x.id===titleId),name=careerTitleName(t?.name||'Championship'),existing=(db.careerHighlights||[]).find(x=>x.superstar_id===superstarId&&x.title_id===titleId);let r;if(existing)r=await sb.from('superstar_career_highlights').update({name,reign_count:count,hidden:false}).eq('id',existing.id);else r=await sb.from('superstar_career_highlights').insert({id:uid('ch'),superstar_id:superstarId,title_id:titleId,name,reign_count:count,hidden:false});if(r.error)return alert('Supabase: '+r.error.message);await wxrcRefreshOne("superstar_career_highlights");closeModal();profile(superstarId);toastMsg('Career Highlight saved online')}
}
async function removeCareerHighlight(superstarId,highlightId){if(!confirm('Remove this Career Highlight?'))return;const r=await sb.from('superstar_career_highlights').delete().eq('id',highlightId);if(r.error)return alert('Supabase: '+r.error.message);await wxrcRefreshOne("superstar_career_highlights");profile(superstarId);toastMsg('Career Highlight removed')}
function profile(id){let s=db.superstars.find(x=>x.id===id);if(!s)return;openModal(s.name,`<div class="profile">${s.image?`<img loading="lazy" decoding="async" src="${esc(s.image)}">`:`<div class="avatar" style="width:130px;height:160px;border-radius:16px;font-size:45px">${esc(s.name[0])}</div>`}<div>${brandBadgeHTML(s.brand||'Unassigned')}<h2 style="margin-top:8px">${esc(s.name)}</h2><div class="muted">${esc(s.nickname||'WWE Superstar')}</div>${isOwner()?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn small blue" onclick="closeModal();manageSuperstar('${s.id}')">Manage Superstar</button><button class="btn small danger" onclick="manageInjuries('${s.id}')">Injuries</button></div>`:''}<div class="kv">${[['Status',s.status],['Finisher',s.finisher],['Signature',s.signature],['Theme Song',s.theme],['Debut',s.debut],['Height',s.height],['Weight',s.weight],['Record',`${s.wins||0}-${s.losses||0}`],['Current Titles',db.champions.filter(c=>c.superstarId===s.id).map(c=>db.championships.find(t=>t.id===c.titleId)?.name).filter(Boolean).join(', ')||'None'],['Recorded Reigns',db.championHistory.filter(x=>x.superstarId===s.id||x.superstarName===s.name).length]].map(x=>`<div><b>${x[0]}</b>${esc(x[1]||'—')}</div>`).join('')}</div></div></div>${careerHighlightsHTML(s)}`)}

// Open the public site directly in News as WWE Universe; login is optional from the top-right button.
window.addEventListener('load',()=>{
 if(!current){
  current={id:'guest',displayName:'Guest',role:'WWE Universe'};
  loadDataCache();
  enter();
  if(initSupabase()) loadOnlineData().then(()=>{renderNav();render()}).catch(e=>console.warn('Public News refresh unavailable',e));
 }
});
</script>
