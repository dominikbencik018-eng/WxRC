.hero{background:linear-gradient(125deg,#261116,#11131a 55%,#0c1a37);border:1px solid #30343d;border-radius:22px;padding:24px;overflow:hidden;position:relative}.hero:after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;background:#d51c2d22;right:-45px;top:-65px}.hero h1{margin:4px 0 6px;font-size:32px}.badge{display:inline-block;font-size:11px;font-weight:900;padding:5px 8px;border-radius:999px;background:#272b34;color:#ddd}.badge.red{background:#53141c;color:#ffb0b8}.badge.blue{background:#142c62;color:#9fc0ff}.badge.green{background:#113d25;color:#8df0ad}.badge.gold{background:#473914;color:#ffe08a}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:16px}.card{background:linear-gradient(180deg,#151820,#101218);border:1px solid #292e38;border-radius:17px;padding:16px;min-width:0}.stat strong{font-size:28px;display:block}.muted{color:var(--muted)}.sectionHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:25px 0 12px}.list{display:grid;gap:10px}.row{background:#12151b;border:1px solid #292e37;border-radius:14px;padding:13px;display:flex;justify-content:space-between;gap:12px;align-items:center}.rowMain{display:flex;gap:12px;align-items:center;min-width:0}.thumb{width:54px;height:54px;border-radius:12px;object-fit:cover;background:#242832}.rowActions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.small{padding:7px 9px;font-size:12px}.champCard{display:grid;grid-template-columns:72px 1fr;gap:14px}.champCard img{width:72px;height:82px;border-radius:13px;object-fit:cover;background:#222}.days{font-size:24px;font-weight:1000;color:var(--gold)}.empty{padding:28px;text-align:center;color:#777;border:1px dashed #333;border-radius:15px}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px;z-index:20}.modalBox{width:min(600px,100%);max-height:90vh;overflow:auto;background:#12151b;border:1px solid #343944;border-radius:20px;padding:20px}.modalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.profile{display:grid;grid-template-columns:130px 1fr;gap:18px}.profile img{width:130px;height:160px;object-fit:cover;border-radius:16px;background:#222}.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.kv div{background:#0c0e12;border:1px solid #292d36;padding:10px;border-radius:10px}.kv b{display:block;font-size:11px;color:#8e95a1;margin-bottom:3px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:10px 14px;border-radius:10px;font-weight:800;z-index:50}

<script>
const SUPABASE_URL='https://jtukhhpdypjaknrozfxz.supabase.co';
const SUPABASE_KEY='sb_publishable_8oivtg25TBra9X0iYlkkhA_kAoaRUNz';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let db={users:[],superstars:[],championships:[],champions:[],championHistory:[],shows:[],transactions:[],gimmickSubmissions:[]}, current=null, page='Home';

function mapRows(rows,kind){
 return (rows||[]).map(x=>{
  if(kind==='profiles')return {id:x.id,username:x.username||'',displayName:x.display_name||'',role:x.role||'WxRC Superstar',superstarId:x.superstar_id||''};
  if(kind==='champions')return {id:x.id,superstarId:x.superstar_id,titleId:x.title_id,dateWon:x.date_won,image:x.image||'',notes:x.notes||''};
  if(kind==='history')return {id:x.id,superstarId:x.superstar_id,superstarName:x.superstar_name||'',titleId:x.title_id,dateWon:x.date_won,dateLost:x.date_lost||'',image:x.image||'',notes:x.notes||''};
  if(kind==='shows')return {id:x.id,name:x.name||'',date:x.show_date||'',time:x.show_time||'',status:x.status||'',venue:x.venue||'',image:x.image||''};
  if(kind==='transactions')return {id:x.id,person:x.person||'',amount:x.amount||0,note:x.note||'',date:x.transaction_date||''};
  if(kind==='gimmicks')return {id:x.id,userId:x.user_id||'',name:x.name||'',nickname:x.nickname||'',brand:x.brand||'',status:x.status||'',finisher:x.finisher||'',signature:x.signature||'',theme:x.theme||'',debut:x.debut||'',height:x.height||'',weight:x.weight||'',notes:x.notes||'',submittedBy:'Online User'};
  return x;
 });
}
async function loadOnlineData(){
 const reqs=[
  sb.from('superstars').select('*').order('created_at'),
  sb.from('championships').select('*').order('created_at'),
  sb.from('champions').select('*').order('created_at'),
  sb.from('champion_history').select('*').order('created_at'),
  sb.from('shows').select('*').order('created_at')
 ];
 const [s,t,c,hist,sh]=await Promise.all(reqs);
 db.superstars=mapRows(s.data);
 db.championships=mapRows(t.data);
 db.champions=mapRows(c.data,'champions');
 db.championHistory=mapRows(hist.data,'history');
 db.shows=mapRows(sh.data,'shows');
 if(current && isOwner()){
  const [p,tr,g]=await Promise.all([sb.from('profiles').select('*'),sb.from('transactions').select('*').order('created_at'),sb.from('gimmick_submissions').select('*').order('created_at')]);
  db.users=mapRows(p.data,'profiles'); db.transactions=mapRows(tr.data,'transactions'); db.gimmickSubmissions=mapRows(g.data,'gimmicks');
 } else { db.users=[]; db.transactions=[]; db.gimmickSubmissions=[]; }
}
async function save(){
 if(!canEdit())return;
 const ops=[];
 if(db.superstars.length)ops.push(sb.from('superstars').upsert(db.superstars.map(x=>({id:x.id,name:x.name,nickname:x.nickname||null,brand:x.brand||null,status:x.status||null,finisher:x.finisher||null,signature:x.signature||null,theme:x.theme||null,debut:x.debut||null,height:x.height||null,weight:x.weight||null,wins:Number(x.wins||0),losses:Number(x.losses||0),image:x.image||null}))));
 if(db.championships.length)ops.push(sb.from('championships').upsert(db.championships.map(x=>({id:x.id,name:x.name,brand:x.brand||null,status:x.status||null,image:x.image||null}))));
 if(db.champions.length)ops.push(sb.from('champions').upsert(db.champions.map(x=>({id:x.id,superstar_id:x.superstarId,title_id:x.titleId,date_won:x.dateWon,image:x.image||null,notes:x.notes||null}))));
 if(db.championHistory.length)ops.push(sb.from('champion_history').upsert(db.championHistory.map(x=>({id:x.id,superstar_id:x.superstarId||null,superstar_name:x.superstarName||null,title_id:x.titleId,date_won:x.dateWon,date_lost:x.dateLost||null,image:x.image||null,notes:x.notes||null}))));
 if(db.shows.length)ops.push(sb.from('shows').upsert(db.shows.map(x=>({id:x.id,name:x.name,show_date:x.date||null,show_time:x.time||null,status:x.status||null,venue:x.venue||null,image:x.image||null}))));
 if(db.transactions.length)ops.push(sb.from('transactions').upsert(db.transactions.map(x=>({id:x.id,person:x.person,amount:Number(x.amount||0),note:x.note||null,transaction_date:x.date||null}))));
 const res=await Promise.all(ops); const bad=res.find(r=>r.error); if(bad){console.error(bad.error);toastMsg('Online save failed')} else toastMsg('Saved online');
}
function uid(p){return crypto.randomUUID()}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function canEdit(){return current && ['WxRC Owner','WxRC Admin','Administrator'].includes(current.role)}
function isOwner(){return current && ['WxRC Owner','WxRC Admin','Administrator'].includes(current.role)}
function isGuest(){return current?.role==='WWE Universe'}

function openSignup(){
 openModal('Create WxRC Superstar Account',`<div class="sub" style="margin-bottom:14px">Enter the 6-digit Try-Out code you received from a WxRC Owner.</div><form id="codeForm">${formField('code')}<button class="btn primary full">Continue</button></form>`);
 codeForm.onsubmit=async e=>{e.preventDefault();let code=codeForm.code.value.trim();if(!/^\d{6}$/.test(code)){alert('The code must contain exactly 6 numbers.');return}let {data,error}=await sb.rpc('verify_signup_code',{code_input:code});if(error||!data){alert('Incorrect Try-Out code.');return}signupDetails()};
}
function signupDetails(){
 openModal('Create WxRC Superstar Account',`<div class="sub" style="margin-bottom:14px">Your account will automatically have the WxRC Superstar role.</div><form id="signupForm">${formField('displayName')}${formField('username')}${formField('email','','email')}${formField('password','','password')}<button class="btn primary full">Create Account</button></form>`);
 signupForm.onsubmit=async e=>{e.preventDefault();let f=signupForm;let {data,error}=await sb.auth.signUp({email:f.email.value.trim(),password:f.password.value,options:{data:{username:f.username.value.trim(),display_name:f.displayName.value.trim()}}});if(error){alert(error.message);return}if(!data.session){closeModal();alert('Account created. Check your email if email confirmation is enabled, then log in.');return}await finishAuth(data.user);closeModal();enter()};
}
async function finishAuth(user){
 let {data:p,error}=await sb.from('profiles').select('*').eq('id',user.id).single();
 if(error||!p){alert('Profile could not be loaded.');return false}
 current={id:p.id,username:p.username||'',displayName:p.display_name||'User',role:p.role||'WxRC Superstar',superstarId:p.superstar_id||''};
 await loadOnlineData();return true;
}
async function login(){
 loginError.textContent='Signing in...';
 let {data,error}=await sb.auth.signInWithPassword({email:loginUser.value.trim(),password:loginPass.value});
 if(error){loginError.textContent=error.message;return}
 if(await finishAuth(data.user)){loginError.textContent='';enter()}
}
async function guestLogin(){current={id:'guest',displayName:'Guest',role:'WWE Universe'};await loadOnlineData();enter()}
function enter(){document.getElementById('login').classList.add('hidden');document.getElementById('main').classList.remove('hidden');renderNav();render()}
async function logout(){await sb.auth.signOut();current=null;document.getElementById('main').classList.add('hidden');document.getElementById('login').classList.remove('hidden');loginPass.value=''}
const tableMap={superstars:'superstars',championships:'championships',champions:'champions',championHistory:'champion_history',shows:'shows',transactions:'transactions',gimmickSubmissions:'gimmick_submissions'};
const navIcons={'Home':'⌂','Superstars':'★','Roster':'♟','Submit a Gimmick':'＋','Champions':'♛','Championships':'◆','Shows':'▣','WWE Coins':'◉','Settings':'⚙'};
function navLabel(n){return `<span style="font-size:18px;display:block;line-height:20px">${navIcons[n]||'•'}</span><span>${n}</span>`}
function renderNav(){let allowed=nav.filter(n=>n!=='Settings'||isOwner());let h=allowed.map(n=>`<button class="${n===page?'active':''} ${n==='Settings'?'adminOnly':''}" onclick="go('${n.replaceAll("'","\\'")}')" style="display:flex;align-items:center;gap:10px">${navIcons[n]||'•'} <span>${n}</span></button>`).join('');sideNav.innerHTML=h;mobileNav.innerHTML=allowed.map(n=>`<button class="${n===page?'active':''}" onclick="go('${n}')">${navLabel(n)}</button>`).join('')}
function go(n){page=n;renderNav();render()}
function render(){pageTitle.textContent=page;userName.textContent=current.displayName;userRole.textContent=normalizeRole(current.role);userAvatar.textContent=(current.displayName||'G')[0].toUpperCase();const map={'Home':home,'Superstars':superstars,'Roster':roster,'Submit a Gimmick':submitGimmick,'Champions':champions,'Championships':championships,'Shows':shows,'WWE Coins':coins,'Settings':settings};try{(map[page]||home)()}catch(err){console.error(err);view.innerHTML='<div class="card"><h3>Page could not be displayed.</h3><div class="sub">Please refresh the app. If this continues, report it to WxRC Management.</div></div>'}}
function stats(){return {superstars:db.superstars.length,champions:db.champions.length,shows:db.shows.length}}
function home(){let s=stats();view.innerHTML=`<div class="hero"><span class="badge red">WWE x ROBLOX COMMUNITY</span><h1>Community Control Center</h1><div class="muted">View the roster, champions, shows and WWE x Roblox Community information in one place.</div></div><div class="grid">${[['Superstars',s.superstars],['Current Champions',s.champions],['Shows',s.shows]].map(x=>`<div class="card stat"><span class="muted">${x[0]}</span><strong>${x[1]}</strong></div>`).join('')}</div><div class="sectionHead"><h2>Current Champions</h2></div>${champList(false)}`}

function superstars(){view.innerHTML=`<div class="sectionHead"><div><h2>Superstars</h2><div class="sub">WWE x Roblox Community roster profiles.</div></div>${canEdit()?`<button class="btn primary" onclick="editSuperstar()">+ Add Superstar</button>`:''}</div><div class="superGrid">${db.superstars.map(s=>`<div class="superCard" onclick="profile('${s.id}')">${s.image?`<img src="${esc(s.image)}">`:`<div class="avatar" style="width:100%;height:100%;border-radius:0;font-size:72px">${esc(s.name?.[0]||'?')}</div>`}<div class="shade"></div><div class="info"><span class="badge ${s.status==='Active'?'green':''}">${esc(s.status||'Active')}</span><h3>${esc(s.name)}</h3><div class="sub">${esc(s.nickname||'WWE Superstar')} · ${esc(s.brand||'Unassigned')}</div>${canEdit()?`<div style="margin-top:10px"><button class="btn small blue" onclick="event.stopPropagation();editSuperstar('${s.id}')">✎ Edit Superstar</button> <button class="btn small danger" onclick="event.stopPropagation();del('superstars','${s.id}')">Delete</button></div>`:''}</div></div>`).join('')||empty()}</div>`}

function daysSince(d){if(!d)return 0;let a=new Date(d+'T00:00:00'),b=new Date();a.setHours(0,0,0,0);b.setHours(0,0,0,0);return Math.max(0,Math.floor((b-a)/86400000)+1)}
function mdy(d){if(!d)return '—';let p=d.split('-');if(p.length!==3)return d;return `${Number(p[1])}/${Number(p[2])}/${p[0]}`}

function activeChampionFor(titleId){return db.champions.find(c=>c.titleId===titleId)}
function reignDays(start,end){
 if(!start)return 0;
 const a=new Date(start+'T00:00:00');
 const b=end?new Date(end+'T00:00:00'):new Date();
 return Math.max(0,Math.floor((b-a)/86400000));
}
function reignTime(start,end){
 const d=reignDays(start,end);
 if(d<1)return '<1 DAY';
 return `${d} ${d===1?'DAY':'DAYS'}`;
}
function champList(actions=true){let currentTitles=db.championships.map(t=>({t,c:activeChampionFor(t.id)})).filter(x=>x.c);return `<div class="titleGrid">${currentTitles.map(({t,c})=>{let s=db.superstars.find(x=>x.id===c.superstarId);return `<div class="titleCard" onclick="championshipHistory('${t.id}')">${(c.image||s?.image)?`<img src="${esc(c.image||s.image)}">`:`<div class="avatar" style="width:100%;height:100%;border-radius:0;font-size:72px">${esc(s?.name?.[0]||'?')}</div>`}<div class="shade"></div><div class="info"><span class="badge gold">CHAMPION</span><h3>${esc(s?.name||'Unknown Superstar')}</h3><div class="titleName">${esc(t.name)}</div><div class="sub">${mdy(c.dateWon)} – PRESENT</div><div class="days" style="font-size:18px;margin-top:3px">${reignTime(c.dateWon)}</div>${actions&&canEdit()?`<div style="margin-top:11px;display:flex;gap:7px;flex-wrap:wrap"><button class="btn small blue" onclick="event.stopPropagation();editChampion('${c.id}')">✎ Edit Champion</button><button class="btn small danger" onclick="event.stopPropagation();deleteChampion('${c.id}')">− Delete Champion</button></div>`:''}</div></div>`}).join('')||empty()}</div>`}

function championshipHistory(titleId){
 const t=db.championships.find(x=>x.id===titleId); const c=activeChampionFor(titleId); const s=c?db.superstars.find(x=>x.id===c.superstarId):null;
 let hist=(db.championHistory||[]).filter(h=>h.titleId===titleId).sort((a,b)=>(b.dateWon||'').localeCompare(a.dateWon||''));
 let rows=[];
 if(c)rows.push({id:c.id,name:s?.name||'Unknown Superstar',dateWon:c.dateWon,dateLost:'',current:true,notes:c.notes||''});
 hist.forEach(h=>rows.push({id:h.id,name:h.superstarName||db.superstars.find(x=>x.id===h.superstarId)?.name||'Unknown Superstar',dateWon:h.dateWon,dateLost:h.dateLost,current:false,notes:h.notes||''}));
 view.innerHTML=`<div class="sectionHead"><div><button class="btn ghost small" onclick="go('Champions')">← Champions</button><h2 style="margin-top:12px">${esc(t?.name||'Championship')}</h2><div class="sub">Championship history</div></div></div>${c?`<div class="historyHero">${(c.image||s?.image)?`<img src="${esc(c.image||s.image)}">`:''}<div class="shade"></div><div class="copy"><span class="badge gold">CURRENT CHAMPION</span><h1>${esc(s?.name||'Unknown Superstar')}</h1><div>${mdy(c.dateWon)} – PRESENT</div><div class="days" style="font-size:20px;margin-top:4px">${reignTime(c.dateWon)}</div>${c.notes?`<div style="margin-top:10px;line-height:1.45">${esc(c.notes)}</div>`:''}</div></div>`:''}<div class="historyList">${rows.map(r=>`<div class="historyRow"><div class="historyName">${esc(r.name)}</div><div class="historyDates">${mdy(r.dateWon)}${r.current?' - PRESENT':` - ${mdy(r.dateLost)}`}</div><div class="historyDays">${reignTime(r.dateWon,r.dateLost)}</div>${r.notes?`<div style="margin-top:13px;font-size:15px;line-height:1.5;color:#333">${esc(r.notes)}</div>`:''}${canEdit()&&!r.current?`<div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:13px"><button class="btn small blue" onclick="editHistory('${r.id}','${titleId}')">✎ Edit History</button><button class="btn small danger" onclick="deleteHistory('${r.id}','${titleId}')">− Delete History</button></div>`:''}</div>`).join('')||`<div class="historyRow">No championship history yet.</div>`}</div>`;
}

function formField(k,v='',type='text'){let label=k.replace(/([A-Z])/g,' $1').replace(/^./,x=>x.toUpperCase());if(k==='notes')return `<div class="field"><label>${label.toUpperCase()}</label><textarea name="${k}">${esc(v)}</textarea></div>`;if(['date','dateWon','startDate','endDate','debut'].includes(k))type='date';return `<div class="field"><label>${label.toUpperCase()}</label><input name="${k}" type="${type}" value="${esc(v)}"></div>`}

function fileToDataURL(file){
 return new Promise((resolve,reject)=>{
  if(!file){resolve('');return}
  const r=new FileReader();
  r.onload=()=>resolve(r.result);
  r.onerror=reject;
  r.readAsDataURL(file);
 });
}
function photoField(current='',label='PHOTO'){
 return `<div class="field"><label>${label}</label><div style="display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:center">${current?`<img id="photoPreview" class="thumb" style="width:84px;height:84px" src="${esc(current)}">`:`<div id="photoPreview" class="thumb avatar" style="width:84px;height:84px;border-radius:12px">+</div>`}<div><input id="photoFile" name="photoFile" type="file" accept="image/*"><div class="sub" style="margin-top:5px">Choose a photo from your device.</div></div></div></div>`;
}
function bindPhotoPreview(){
 const input=document.getElementById('photoFile');
 if(!input)return;
 input.onchange=async()=>{
  const f=input.files?.[0]; if(!f)return;
  const data=await fileToDataURL(f);
  const old=document.getElementById('photoPreview');
  const im=document.createElement('img'); im.id='photoPreview'; im.className='thumb'; im.style.cssText='width:84px;height:84px'; im.src=data;
  old.replaceWith(im);
 };
}

function editGeneric(key,fields,id=''){
 let o=db[key].find(x=>x.id===id)||{};
 openModal(`${id?'Edit':'Add'} ${key.replace(/s$/,'')}`,`<form id="gform">${fields.map(f=>f==='image'?photoField(o.image||'','PHOTO'):formField(f,o[f]||'')).join('')}<button class="btn primary full">Save</button></form>`);
 bindPhotoPreview();
 gform.onsubmit=async e=>{
  e.preventDefault(); let x=id?o:{id:uid(key[0])};
  for(const f of fields){
   if(f==='image'){const file=document.getElementById('photoFile')?.files?.[0];x.image=file?await fileToDataURL(file):(o.image||'')}
   else x[f]=gform.elements[f].value.trim();
  }
  if(!id)db[key].push(x);save();closeModal();render();toastMsg('Saved');
 };
}

function editChampion(id=''){
 let o=db.champions.find(x=>x.id===id)||{};
 openModal(id?'Edit Champion':'Set New Champion',`<form id="cform">${photoField(o.image||'','CHAMPION PHOTO')}<div class="field"><label>SUPERSTAR</label><select name="superstarId">${db.superstars.map(s=>`<option value="${s.id}" ${o.superstarId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>CHAMPIONSHIP</label><select name="titleId">${db.championships.map(t=>`<option value="${t.id}" ${o.titleId===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div>${formField('dateWon',o.dateWon||new Date().toISOString().slice(0,10))}${formField('notes',o.notes||'')}<div class="sub" style="margin:-5px 0 14px">Optional: write who they defeated, PPV/event, location, match details, etc.</div><button class="btn primary full">Save Champion</button></form>`);
 bindPhotoPreview();
 cform.onsubmit=async e=>{
  e.preventDefault();
  const superstarId=cform.superstarId.value,titleId=cform.titleId.value,dateWon=cform.dateWon.value;
  const file=document.getElementById('photoFile')?.files?.[0];
  if(id){
   o.superstarId=superstarId;o.titleId=titleId;o.dateWon=dateWon;o.notes=cform.notes.value.trim();if(file)o.image=await fileToDataURL(file);
  }else{
   const previous=db.champions.find(x=>x.titleId===titleId);
   if(previous){
    const ps=db.superstars.find(x=>x.id===previous.superstarId);
    db.championHistory.push({id:uid('h'),titleId,superstarId:previous.superstarId,superstarName:ps?.name||'',dateWon:previous.dateWon,dateLost:dateWon,image:previous.image||ps?.image||'',notes:previous.notes||''});
    db.champions=db.champions.filter(x=>x.id!==previous.id);
   }
   db.champions.push({id:uid('c'),superstarId,titleId,dateWon,notes:cform.notes.value.trim(),image:file?await fileToDataURL(file):''});
  }
  save();closeModal();render();toastMsg('Champion saved');
 };
}

}
function editTransaction(){openModal('WWE Coins Transaction',`<form id="tform">${formField('person')}${formField('amount','0','number')}${formField('note')}${formField('date',new Date().toISOString().slice(0,10))}<button class="btn primary full">Save Transaction</button></form>`);tform.onsubmit=e=>{e.preventDefault();db.transactions.push({id:uid('tr'),person:tform.person.value.trim(),amount:Number(tform.amount.value),note:tform.note.value.trim(),date:tform.date.value});save();closeModal();render();toastMsg('Transaction saved')}}
async function del(key,id){if(!canEdit()||!confirm('Delete this item?'))return;let table=tableMap[key];if(table){let {error}=await sb.from(table).delete().eq('id',id);if(error){alert(error.message);return}}db[key]=db[key].filter(x=>x.id!==id);render();toastMsg('Deleted online')}

(async()=>{const {data:{session}}=await sb.auth.getSession();if(session?.user){if(await finishAuth(session.user))enter()}})();

if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
