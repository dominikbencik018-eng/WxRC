<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WWE x Roblox">
<link rel="manifest" href="./manifest.webmanifest">
<title>WWE x Roblox Community v3</title>
<style>
:root{--bg:#07080b;--panel:#111319;--panel2:#181b22;--line:#292d37;--text:#f7f7f8;--muted:#9da3af;--red:#e11d2e;--blue:#2366ff;--green:#22c55e;--gold:#f6c453}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1a1d25 0,#08090c 38%,#050608 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit}.hidden{display:none!important}.app{max-width:1150px;margin:auto;min-height:100vh}
.login{min-height:100vh;display:grid;place-items:center;padding:24px}.loginCard{width:min(440px,100%);background:rgba(16,18,24,.96);border:1px solid #30333c;border-radius:26px;padding:28px;box-shadow:0 25px 70px #0009}
.brand{display:flex;align-items:center;gap:13px}.mark{font-size:29px;font-weight:1000;font-style:italic;letter-spacing:-3px}.slash{width:34px;height:5px;background:var(--red);transform:skew(-28deg);display:inline-block;margin-left:-33px;margin-bottom:-12px}.brandText{font-weight:900;letter-spacing:.4px}.sub{color:var(--muted);font-size:13px}
h1{font-size:27px;margin:24px 0 5px}h2{font-size:21px;margin:0}h3{margin:0 0 8px}.field{margin:13px 0}.field label{display:block;font-size:12px;color:#b8bdc8;margin:0 0 6px}
input,select,textarea{width:100%;background:#0a0c10;color:#fff;border:1px solid #343945;border-radius:12px;padding:12px;outline:none}textarea{min-height:85px;resize:vertical}
.btn{border:0;border-radius:12px;padding:12px 15px;font-weight:800;cursor:pointer;background:#272b34;color:#fff}.btn.primary{background:linear-gradient(135deg,#ef233c,#b20f21)}.btn.blue{background:#174ed6}.btn.danger{background:#7f1520}.btn.ghost{border:1px solid #343945;background:transparent}.full{width:100%}.divider{display:flex;align-items:center;gap:10px;color:#707783;font-size:12px;margin:17px 0}.divider:before,.divider:after{content:"";height:1px;background:#30343d;flex:1}
.shell{display:grid;grid-template-columns:235px 1fr;min-height:100vh}.side{border-right:1px solid #252832;background:#090a0e;padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}.side .brand{padding:5px 7px 20px}.nav button{width:100%;text-align:left;border:0;background:transparent;color:#c8ccd4;padding:11px 12px;border-radius:10px;margin:2px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#1a1d24;color:#fff}.nav .adminOnly{color:#ff9aa5}.content{padding:24px 25px 90px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:23px}.userchip{display:flex;align-items:center;gap:9px;background:#14171d;border:1px solid #292d35;padding:7px 10px;border-radius:99px}.avatar{width:30px;height:30px;border-radius:50%;object-fit:cover;background:#2c3038;display:grid;place-items:center;font-weight:900}
.hero{background:linear-gradient(125deg,#261116,#11131a 55%,#0c1a37);border:1px solid #30343d;border-radius:22px;padding:24px;overflow:hidden;position:relative}.hero:after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;background:#d51c2d22;right:-45px;top:-65px}.hero h1{margin:4px 0 6px;font-size:32px}.badge{display:inline-block;font-size:11px;font-weight:900;padding:5px 8px;border-radius:999px;background:#272b34;color:#ddd}.badge.red{background:#53141c;color:#ffb0b8}.badge.blue{background:#142c62;color:#9fc0ff}.badge.green{background:#113d25;color:#8df0ad}.badge.gold{background:#473914;color:#ffe08a}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:16px}.card{background:linear-gradient(180deg,#151820,#101218);border:1px solid #292e38;border-radius:17px;padding:16px;min-width:0}.stat strong{font-size:28px;display:block}.muted{color:var(--muted)}.sectionHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:25px 0 12px}.list{display:grid;gap:10px}.row{background:#12151b;border:1px solid #292e37;border-radius:14px;padding:13px;display:flex;justify-content:space-between;gap:12px;align-items:center}.rowMain{display:flex;gap:12px;align-items:center;min-width:0}.thumb{width:54px;height:54px;border-radius:12px;object-fit:cover;background:#242832}.rowActions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.small{padding:7px 9px;font-size:12px}.champCard{display:grid;grid-template-columns:72px 1fr;gap:14px}.champCard img{width:72px;height:82px;border-radius:13px;object-fit:cover;background:#222}.days{font-size:24px;font-weight:1000;color:var(--gold)}.empty{padding:28px;text-align:center;color:#777;border:1px dashed #333;border-radius:15px}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px;z-index:20}.modalBox{width:min(600px,100%);max-height:90vh;overflow:auto;background:#12151b;border:1px solid #343944;border-radius:20px;padding:20px}.modalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.profile{display:grid;grid-template-columns:130px 1fr;gap:18px}.profile img{width:130px;height:160px;object-fit:cover;border-radius:16px;background:#222}.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.kv div{background:#0c0e12;border:1px solid #292d36;padding:10px;border-radius:10px}.kv b{display:block;font-size:11px;color:#8e95a1;margin-bottom:3px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:10px 14px;border-radius:10px;font-weight:800;z-index:50}
.mobilebar{display:none}
.superGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.superCard{position:relative;min-height:330px;border-radius:20px;overflow:hidden;background:#11141a;border:1px solid #2d323c;cursor:pointer}
.superCard img{width:100%;height:330px;object-fit:cover;display:block}
.superCard .shade{position:absolute;inset:35% 0 0;background:linear-gradient(transparent,#050608 88%)}
.superCard .info{position:absolute;left:16px;right:16px;bottom:16px}
.superCard h3{font-size:24px;margin:5px 0 2px}
.titleGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.titleCard{position:relative;min-height:360px;border-radius:21px;overflow:hidden;background:#11141a;border:1px solid #2d323c;cursor:pointer}
.titleCard>img{width:100%;height:360px;object-fit:cover;display:block}
.titleCard .shade{position:absolute;inset:25% 0 0;background:linear-gradient(transparent,#050608 88%)}
.titleCard .info{position:absolute;left:18px;right:18px;bottom:18px}
.titleCard h3{font-size:27px;margin:7px 0 3px}
.titleCard .titleName{font-weight:900;font-size:14px}
.historyHero{position:relative;min-height:380px;border-radius:22px;overflow:hidden;background:#101319;border:1px solid #303540;margin-bottom:18px}
.historyHero img{width:100%;height:380px;object-fit:cover}
.historyHero .shade{position:absolute;inset:20% 0 0;background:linear-gradient(transparent,#050608 90%)}
.historyHero .copy{position:absolute;left:20px;right:20px;bottom:20px}
.historyHero h1{margin:6px 0 3px;font-size:34px}
.historyList{background:#f8f8f8;color:#111;border-radius:18px;overflow:hidden}
.historyRow{padding:25px 22px;border-bottom:1px solid #d5d5d5}
.historyRow:last-child{border-bottom:0}
.historyName{font-family:Georgia,serif;font-size:30px;margin-bottom:13px}
.historyDates{font-weight:1000;font-size:19px;text-transform:uppercase}
.historyDays{font-size:16px;color:#606060;margin-top:5px}
.settingsGroup{background:#12151b;border:1px solid #292e37;border-radius:17px;padding:16px;margin-top:14px}
.rolePill{display:inline-block;padding:5px 8px;border-radius:999px;background:#242934;font-size:11px;font-weight:900}

@media(max-width:760px){.shell{display:block}.side{display:none}.content{padding:17px 14px 90px}.grid{grid-template-columns:1fr 1fr}.top{align-items:flex-start}.hero h1{font-size:27px}.mobilebar{display:flex;position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);left:10px;right:10px;background:#0b0c10f2;backdrop-filter:blur(15px);border:1px solid #292d35;border-radius:16px;z-index:10;overflow-x:auto;padding:7px 8px;box-shadow:0 12px 30px #0008}.mobilebar button{min-width:88px;border:0;background:transparent;color:#aaa;padding:9px 7px;font-size:11px}.mobilebar button.active{color:#fff}.profile{grid-template-columns:1fr}.profile img{width:100%;height:250px}.two{grid-template-columns:1fr}.row{align-items:flex-start}.rowActions{max-width:100px}.champCard{grid-template-columns:62px 1fr}.grid .card{padding:13px}.superGrid,.titleGrid{grid-template-columns:1fr}.superCard,.superCard img{height:390px}.titleCard,.titleCard>img{height:420px}.historyHero,.historyHero img{height:430px}.historyName{font-size:27px}}
</style>
</head>
<body>
<div id="login" class="login">
  <div class="loginCard">
    <div class="brand"><div><span class="mark">WWE</span><span class="slash"></span></div><div><div class="brandText">WWE x Roblox Community</div><div class="sub">Community Management System</div></div></div>
    <h1>Welcome back</h1><div class="sub">Sign in as a WWE Superstar or WWE Staff member.</div>
    <div class="field"><label>USERNAME</label><input id="loginUser" autocomplete="username"></div>
    <div class="field"><label>PASSWORD</label><input id="loginPass" type="password" autocomplete="current-password"></div>
    <button class="btn primary full" onclick="login()">Log In</button>
    <div class="divider">WWE UNIVERSE</div>
    <button class="btn ghost full" onclick="guestLogin()">Continue as Guest</button>
    <p id="loginError" class="sub" style="color:#ff7e89"></p>
  </div>
</div>

<div id="main" class="app hidden">
<div class="shell">
<aside class="side">
 <div class="brand"><div><span class="mark">WWE</span><span class="slash"></span></div><div><div class="brandText">x Roblox</div><div class="sub">Community</div></div></div>
 <div id="sideNav" class="nav"></div>
</aside>
<main class="content">
 <div class="top"><div><h2 id="pageTitle">Home</h2><div class="sub">WWE x Roblox Community</div></div><div class="userchip"><div id="userAvatar" class="avatar">G</div><div><b id="userName">Guest</b><div id="userRole" class="sub">WWE Universe</div></div><button class="btn small ghost" onclick="logout()">Log out</button></div></div>
 <div id="view"></div>
</main>
</div>
<div id="mobileNav" class="mobilebar"></div>
</div>
<div id="modal" class="modal hidden"><div class="modalBox"><div class="modalHead"><h2 id="modalTitle"></h2><button class="btn small ghost" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>
<div id="toast" class="toast hidden"></div>

<script>
const KEY='wweRobloxCommunityV2';
const seed={
 users:[{id:'u1',username:'admin',password:'admin',displayName:'WxRC Owner',role:'WxRC Owner',superstarId:''}],
 superstars:[
 {id:'s1',name:'Rhea Ripley',brand:'RAW',status:'Active',nickname:'The Eradicator',finisher:'Riptide',signature:'Prism Trap',theme:'',debut:'',height:'',weight:'',wins:0,losses:0,image:''},
 {id:'s2',name:'Ronda Rousey',brand:'RAW',status:'Active',nickname:'The Baddest Woman on the Planet',finisher:'Piper’s Pit',signature:'Armbar',theme:'',debut:'',height:'',weight:'',wins:0,losses:0,image:''}
 ],
 championships:[{id:'t1',name:"Women's World Championship",brand:'RAW',status:'Active',image:''},{id:'t2',name:"Women's Tag Team Championship",brand:'Cross-brand',status:'Active',image:''}],
 champions:[],
 shows:[{id:'sh1',name:'RAW',date:'',time:'',status:'Upcoming',venue:''},{id:'sh2',name:'SmackDown',date:'',time:'',status:'Upcoming',venue:''}],
 matches:[],rivalries:[],storylines:[],contracts:[],transactions:[]
};
let db=load(), current=null, page='Home';
if(!db.championHistory)db.championHistory=[];
if(!db.champions)db.champions=[];
const nav=['Home','Superstars','Roster','Champions','Championships','Shows','Matches','Rivalries','Storylines','Contracts','WWE Coins','Settings'];
function load(){try{return {...structuredClone(seed),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return structuredClone(seed)}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function canEdit(){return current && ['WxRC Owner','WxRC Staff','Administrator','WWE Staff'].includes(current.role)}
function isOwner(){return current && ['WxRC Owner','Administrator'].includes(current.role)}
function isGuest(){return current?.role==='WWE Universe'}
function login(){let u=db.users.find(x=>x.username===loginUser.value.trim()&&x.password===loginPass.value);if(!u){loginError.textContent='Incorrect username or password.';return}current=u;enter()}
function guestLogin(){current={id:'guest',displayName:'Guest',role:'WWE Universe'};enter()}
function enter(){document.getElementById('login').classList.add('hidden');document.getElementById('main').classList.remove('hidden');renderNav();render()}
function logout(){current=null;document.getElementById('main').classList.add('hidden');document.getElementById('login').classList.remove('hidden');loginPass.value=''}
function renderNav(){let allowed=nav.filter(n=>n!=='Settings'||isOwner());let h=allowed.map(n=>`<button class="${n===page?'active':''} ${n==='Settings'?'adminOnly':''}" onclick="go('${n.replaceAll("'","\\'")}')">${n}</button>`).join('');sideNav.innerHTML=h;mobileNav.innerHTML=allowed.map(n=>`<button class="${n===page?'active':''}" onclick="go('${n}')">${n}</button>`).join('')}
function go(n){page=n;renderNav();render()}
function render(){pageTitle.textContent=page;userName.textContent=current.displayName;userRole.textContent=normalizeRole(current.role);userAvatar.textContent=(current.displayName||'G')[0].toUpperCase();const map={'Home':home,'Superstars':superstars,'Roster':roster,'Champions':champions,'Championships':championships,'Shows':shows,'Matches':matches,'Rivalries':rivalries,'Storylines':storylines,'Contracts':contracts,'WWE Coins':coins,'Settings':settings};(map[page]||home)()}
function stats(){return {superstars:db.superstars.length,champions:db.champions.length,shows:db.shows.length,matches:db.matches.length}}
function home(){let s=stats();view.innerHTML=`<div class="hero"><span class="badge red">WWE x ROBLOX COMMUNITY</span><h1>Community Control Center</h1><div class="muted">Manage the roster, champions, shows, matches and community operations from one place.</div></div><div class="grid">${[['Superstars',s.superstars],['Current Champions',s.champions],['Shows',s.shows],['Matches',s.matches]].map(x=>`<div class="card stat"><span class="muted">${x[0]}</span><strong>${x[1]}</strong></div>`).join('')}</div><div class="sectionHead"><h2>Current Champions</h2></div>${champList(false)}`}
function img(src,name){return src?`<img class="thumb" src="${esc(src)}">`:`<div class="thumb avatar">${esc(name?.[0]||'?')}</div>`}
function superstars(){view.innerHTML=`<div class="sectionHead"><div><h2>Superstars</h2><div class="sub">WWE x Roblox Community roster profiles.</div></div>${canEdit()?`<button class="btn primary" onclick="editSuperstar()">+ Add Superstar</button>`:''}</div><div class="superGrid">${db.superstars.map(s=>`<div class="superCard" onclick="profile('${s.id}')">${s.image?`<img src="${esc(s.image)}">`:`<div class="avatar" style="width:100%;height:100%;border-radius:0;font-size:72px">${esc(s.name?.[0]||'?')}</div>`}<div class="shade"></div><div class="info"><span class="badge ${s.status==='Active'?'green':''}">${esc(s.status||'Active')}</span><h3>${esc(s.name)}</h3><div class="sub">${esc(s.nickname||'WWE Superstar')} · ${esc(s.brand||'Unassigned')}</div>${canEdit()?`<div style="margin-top:10px"><button class="btn small blue" onclick="event.stopPropagation();editSuperstar('${s.id}')">Edit</button> <button class="btn small danger" onclick="event.stopPropagation();del('superstars','${s.id}')">Delete</button></div>`:''}</div></div>`).join('')||empty()}</div>`}
function roster(){let brands=['RAW','SmackDown','NXT','Unassigned'];view.innerHTML=`<div class="sectionHead"><div><h2>Roster</h2><div class="sub">Superstars grouped by brand.</div></div></div>${brands.map(b=>`<div class="sectionHead"><h3>${b}</h3><span class="badge">${db.superstars.filter(s=>(s.brand||'Unassigned')===b).length}</span></div><div class="list">${db.superstars.filter(s=>(s.brand||'Unassigned')===b).map(s=>`<div class="row"><div class="rowMain">${img(s.image,s.name)}<div><b>${esc(s.name)}</b><div class="sub">${esc(s.status)}</div></div></div><button class="btn small" onclick="profile('${s.id}')">Profile</button></div>`).join('')||empty()}</div>`).join('')}`}
function daysSince(d){if(!d)return 0;let a=new Date(d+'T00:00:00'),b=new Date();a.setHours(0,0,0,0);b.setHours(0,0,0,0);return Math.max(0,Math.floor((b-a)/86400000)+1)}
function activeChampionFor(titleId){return db.champions.find(c=>c.titleId===titleId)}
function reignDays(start,end=''){if(!start)return 0;let a=new Date(start+'T00:00:00'),b=end?new Date(end+'T00:00:00'):new Date();a.setHours(0,0,0,0);b.setHours(0,0,0,0);return Math.max(0,Math.floor((b-a)/86400000)+1)}
function champList(actions=true){let currentTitles=db.championships.map(t=>({t,c:activeChampionFor(t.id)})).filter(x=>x.c);return `<div class="titleGrid">${currentTitles.map(({t,c})=>{let s=db.superstars.find(x=>x.id===c.superstarId);return `<div class="titleCard" onclick="championshipHistory('${t.id}')">${(c.image||s?.image)?`<img src="${esc(c.image||s.image)}">`:`<div class="avatar" style="width:100%;height:100%;border-radius:0;font-size:72px">${esc(s?.name?.[0]||'?')}</div>`}<div class="shade"></div><div class="info"><span class="badge gold">CHAMPION</span><h3>${esc(s?.name||'Unknown Superstar')}</h3><div class="titleName">${esc(t.name)}</div><div class="sub">${esc(c.dateWon||'—')} – PRESENT · ${reignDays(c.dateWon)} days</div>${actions&&canEdit()?`<div style="margin-top:10px"><button class="btn small blue" onclick="event.stopPropagation();editChampion('${c.id}')">Edit</button></div>`:''}</div></div>`}).join('')||empty()}</div>`}
function champions(){view.innerHTML=`<div class="sectionHead"><div><h2>Champions</h2><div class="sub">Current title holders. Tap a champion to see the full title history.</div></div>${canEdit()?`<button class="btn primary" onclick="editChampion()">+ Set New Champion</button>`:''}</div>${champList()}`}
function championshipHistory(titleId){
 const t=db.championships.find(x=>x.id===titleId); const c=activeChampionFor(titleId); const s=c?db.superstars.find(x=>x.id===c.superstarId):null;
 let hist=(db.championHistory||[]).filter(h=>h.titleId===titleId).sort((a,b)=>(b.dateWon||'').localeCompare(a.dateWon||''));
 let rows=[];
 if(c)rows.push({name:s?.name||'Unknown Superstar',dateWon:c.dateWon,dateLost:'',current:true});
 hist.forEach(h=>rows.push({name:h.superstarName||db.superstars.find(x=>x.id===h.superstarId)?.name||'Unknown Superstar',dateWon:h.dateWon,dateLost:h.dateLost,current:false}));
 view.innerHTML=`<div class="sectionHead"><div><button class="btn ghost small" onclick="go('Champions')">← Champions</button><h2 style="margin-top:12px">${esc(t?.name||'Championship')}</h2><div class="sub">Championship history</div></div></div>${c?`<div class="historyHero">${(c.image||s?.image)?`<img src="${esc(c.image||s.image)}">`:''}<div class="shade"></div><div class="copy"><span class="badge gold">CURRENT CHAMPION</span><h1>${esc(s?.name||'Unknown Superstar')}</h1><div>${esc(c.dateWon||'—')} – PRESENT · ${reignDays(c.dateWon)} days</div></div></div>`:''}<div class="historyList">${rows.map(r=>`<div class="historyRow"><div class="historyName">${esc(r.name)}</div><div class="historyDates">${prettyDate(r.dateWon)}${r.current?' - PRESENT':` - ${prettyDate(r.dateLost)}`}</div><div class="historyDays">${reignDays(r.dateWon,r.dateLost)} ${reignDays(r.dateWon,r.dateLost)===1?'day':'days'}</div></div>`).join('')||`<div class="historyRow">No championship history yet.</div>`}</div>`;
}
function prettyDate(d){if(!d)return '—';let x=new Date(d+'T00:00:00');return x.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}).toUpperCase()}
function championships(){generic('Championships','Create and manage championships.','championships',['name','brand','status','image'])}
function shows(){generic('Shows','Manage RAW, SmackDown and community events.','shows',['name','date','time','status','venue','image'])}
function matches(){generic('Matches','Book and track matches.','matches',['name','show','participants','stipulation','status','winner'])}
function rivalries(){generic('Rivalries','Manage active and completed rivalries.','rivalries',['name','members','status','notes'])}
function storylines(){generic('Storylines','Keep creative plans and storyline notes.','storylines',['name','members','status','notes'])}
function contracts(){generic('Contracts','Manage Superstar and Staff contracts.','contracts',['name','person','value','startDate','endDate','status'])}
function coins(){let balances={};db.transactions.forEach(t=>balances[t.person]=(balances[t.person]||0)+Number(t.amount||0));view.innerHTML=`<div class="sectionHead"><div><h2>WWE Coins</h2><div class="sub">Community economy and transaction history.</div></div>${canEdit()?`<button class="btn primary" onclick="editTransaction()">+ Transaction</button>`:''}</div><div class="grid">${Object.entries(balances).map(([p,b])=>`<div class="card stat"><span class="muted">${esc(p)}</span><strong>${b}</strong><span class="badge gold">WWE COINS</span></div>`).join('')||empty()}</div><div class="sectionHead"><h3>Transactions</h3></div><div class="list">${db.transactions.slice().reverse().map(t=>`<div class="row"><div><b>${esc(t.person)}</b><div class="sub">${esc(t.note||'Transaction')} · ${esc(t.date||'')}</div></div><b>${Number(t.amount)>0?'+':''}${Number(t.amount)}</b></div>`).join('')||empty()}</div>`}
function settings(){
 if(!isOwner()){go('Home');return}
 view.innerHTML=`<div class="sectionHead"><div><h2>Settings</h2><div class="sub">WWE x Roblox Community account management.</div></div></div><div class="settingsGroup"><div class="sectionHead" style="margin-top:0"><div><h3>Account Management</h3><div class="sub">Create accounts for Owners, Staff and Superstars.</div></div><button class="btn primary" onclick="editUser()">+ Create Account</button></div><div class="list">${db.users.map(u=>`<div class="row"><div><b>${esc(u.displayName)}</b><div class="sub">@${esc(u.username)} · <span class="rolePill">${esc(normalizeRole(u.role))}</span></div></div><div class="rowActions"><button class="btn small blue" onclick="editUser('${u.id}')">Edit</button>${u.id!=='u1'?`<button class="btn small danger" onclick="del('users','${u.id}')">Delete</button>`:''}</div></div>`).join('')}</div></div>`;
}
function normalizeRole(r){return ({'Administrator':'WxRC Owner','WWE Staff':'WxRC Staff','WWE Superstar':'WxRC Superstar'})[r]||r}
function generic(title,desc,key,fields){view.innerHTML=`<div class="sectionHead"><div><h2>${title}</h2><div class="sub">${desc}</div></div>${canEdit()?`<button class="btn primary" onclick='editGeneric("${key}",${JSON.stringify(fields)})'>+ Add</button>`:''}</div><div class="list">${db[key].map(o=>`<div class="row"><div class="rowMain">${o.image?`<img class="thumb" src="${esc(o.image)}">`:''}<div><b>${esc(o.name||o.person||'Item')}</b><div class="sub">${fields.filter(f=>f!=='name'&&f!=='image').map(f=>esc(o[f]||'')).filter(Boolean).join(' · ')}</div></div></div>${canEdit()?`<div class="rowActions"><button class="btn small blue" onclick='editGeneric("${key}",${JSON.stringify(fields)},"${o.id}")'>Edit</button><button class="btn small danger" onclick="del('${key}','${o.id}')">Delete</button></div>`:''}</div>`).join('')||empty()}</div>`}
function empty(){return `<div class="empty">Nothing here yet.</div>`}
function openModal(title,body){modalTitle.textContent=title;modalBody.innerHTML=body;modal.classList.remove('hidden')}
function closeModal(){modal.classList.add('hidden')}
function toastMsg(s){toast.textContent=s;toast.classList.remove('hidden');setTimeout(()=>toast.classList.add('hidden'),1700)}
function formField(k,v='',type='text'){let label=k.replace(/([A-Z])/g,' $1').replace(/^./,x=>x.toUpperCase());if(k==='notes')return `<div class="field"><label>${label.toUpperCase()}</label><textarea name="${k}">${esc(v)}</textarea></div>`;if(['date','dateWon','startDate','endDate','debut'].includes(k))type='date';return `<div class="field"><label>${label.toUpperCase()}</label><input name="${k}" type="${type}" value="${esc(v)}"></div>`}

function fileToDataURL(file){
 return new Promise((resolve,reject)=>{
  if(!file){resolve('');return}
  const r=new FileReader();
  r.onload=()=>resolve(r.result);
  r.onerror=reject;
  r.readAsDataURL(file);
 });
}
function photoField(current='',label='PHOTO'){
 return `<div class="field"><label>${label}</label><div style="display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:center">${current?`<img id="photoPreview" class="thumb" style="width:84px;height:84px" src="${esc(current)}">`:`<div id="photoPreview" class="thumb avatar" style="width:84px;height:84px;border-radius:12px">+</div>`}<div><input id="photoFile" name="photoFile" type="file" accept="image/*"><div class="sub" style="margin-top:5px">Choose a photo from your device.</div></div></div></div>`;
}
function bindPhotoPreview(){
 const input=document.getElementById('photoFile');
 if(!input)return;
 input.onchange=async()=>{
  const f=input.files?.[0]; if(!f)return;
  const data=await fileToDataURL(f);
  const old=document.getElementById('photoPreview');
  const im=document.createElement('img'); im.id='photoPreview'; im.className='thumb'; im.style.cssText='width:84px;height:84px'; im.src=data;
  old.replaceWith(im);
 };
}

function editGeneric(key,fields,id=''){
 let o=db[key].find(x=>x.id===id)||{};
 openModal(`${id?'Edit':'Add'} ${key.replace(/s$/,'')}`,`<form id="gform">${fields.map(f=>f==='image'?photoField(o.image||'','PHOTO'):formField(f,o[f]||'')).join('')}<button class="btn primary full">Save</button></form>`);
 bindPhotoPreview();
 gform.onsubmit=async e=>{
  e.preventDefault(); let x=id?o:{id:uid(key[0])};
  for(const f of fields){
   if(f==='image'){const file=document.getElementById('photoFile')?.files?.[0];x.image=file?await fileToDataURL(file):(o.image||'')}
   else x[f]=gform.elements[f].value.trim();
  }
  if(!id)db[key].push(x);save();closeModal();render();toastMsg('Saved');
 };
}
function editSuperstar(id=''){
 let o=db.superstars.find(x=>x.id===id)||{};
 let fields=['name','nickname','brand','status','finisher','signature','theme','debut','height','weight','wins','losses'];
 openModal(id?'Edit Superstar':'Add Superstar',`<form id="sform">${photoField(o.image||'','SUPERSTAR PHOTO')}<div class="two">${fields.map(f=>formField(f,o[f]??'',['wins','losses'].includes(f)?'number':'text')).join('')}</div><button class="btn primary full">Save Superstar</button></form>`);
 bindPhotoPreview();
 sform.onsubmit=async e=>{e.preventDefault();let x=id?o:{id:uid('s')};fields.forEach(f=>x[f]=sform.elements[f].value.trim());const file=document.getElementById('photoFile')?.files?.[0];x.image=file?await fileToDataURL(file):(o.image||'');if(!id)db.superstars.push(x);save();closeModal();render();toastMsg('Superstar saved')};
}
function profile(id){let s=db.superstars.find(x=>x.id===id);openModal(s.name,`<div class="profile">${s.image?`<img src="${esc(s.image)}">`:`<div class="avatar" style="width:130px;height:160px;border-radius:16px;font-size:45px">${esc(s.name[0])}</div>`}<div><span class="badge red">${esc(s.brand||'Unassigned')}</span><h2 style="margin-top:8px">${esc(s.name)}</h2><div class="muted">${esc(s.nickname||'WWE Superstar')}</div><div class="kv">${[['Status',s.status],['Finisher',s.finisher],['Signature',s.signature],['Theme Song',s.theme],['Debut',s.debut],['Height',s.height],['Weight',s.weight],['Record',`${s.wins||0}-${s.losses||0}`]].map(x=>`<div><b>${x[0]}</b>${esc(x[1]||'—')}</div>`).join('')}</div></div></div>`)}
function editChampion(id=''){
 let o=db.champions.find(x=>x.id===id)||{};
 openModal(id?'Edit Champion':'Set New Champion',`<form id="cform">${photoField(o.image||'','CHAMPION PHOTO')}<div class="field"><label>SUPERSTAR</label><select name="superstarId">${db.superstars.map(s=>`<option value="${s.id}" ${o.superstarId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>CHAMPIONSHIP</label><select name="titleId">${db.championships.map(t=>`<option value="${t.id}" ${o.titleId===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div>${formField('dateWon',o.dateWon||new Date().toISOString().slice(0,10))}<button class="btn primary full">Save Champion</button></form>`);
 bindPhotoPreview();
 cform.onsubmit=async e=>{
  e.preventDefault();
  const superstarId=cform.superstarId.value,titleId=cform.titleId.value,dateWon=cform.dateWon.value;
  const file=document.getElementById('photoFile')?.files?.[0];
  if(id){
   o.superstarId=superstarId;o.titleId=titleId;o.dateWon=dateWon;if(file)o.image=await fileToDataURL(file);
  }else{
   const previous=db.champions.find(x=>x.titleId===titleId);
   if(previous){
    const ps=db.superstars.find(x=>x.id===previous.superstarId);
    db.championHistory.push({id:uid('h'),titleId,superstarId:previous.superstarId,superstarName:ps?.name||'',dateWon:previous.dateWon,dateLost:dateWon,image:previous.image||ps?.image||''});
    db.champions=db.champions.filter(x=>x.id!==previous.id);
   }
   db.champions.push({id:uid('c'),superstarId,titleId,dateWon,image:file?await fileToDataURL(file):''});
  }
  save();closeModal();render();toastMsg('Champion saved');
 };
}
function editUser(id=''){
 let o=db.users.find(x=>x.id===id)||{};
 openModal(id?'Edit Account':'Create Account',`<form id="uform">${formField('displayName',o.displayName||'')}${formField('username',o.username||'')}${formField('password',o.password||'','password')}<div class="field"><label>ROLE</label><select name="role">${['WxRC Owner','WxRC Staff','WxRC Superstar'].map(r=>`<option ${normalizeRole(o.role)===r?'selected':''}>${r}</option>`).join('')}</select></div><div class="field"><label>LINKED SUPERSTAR</label><select name="superstarId"><option value="">None</option>${db.superstars.map(s=>`<option value="${s.id}" ${o.superstarId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><button class="btn primary full">Save Account</button></form>`);
 uform.onsubmit=e=>{e.preventDefault();let x=id?o:{id:uid('u')};['displayName','username','password','role','superstarId'].forEach(f=>x[f]=uform.elements[f].value.trim());if(db.users.some(y=>y.username===x.username&&y.id!==x.id)){alert('Username already exists.');return}if(!id)db.users.push(x);save();closeModal();renderNav();render();toastMsg('Account saved')};
}
function editTransaction(){openModal('WWE Coins Transaction',`<form id="tform">${formField('person')}${formField('amount','0','number')}${formField('note')}${formField('date',new Date().toISOString().slice(0,10))}<button class="btn primary full">Save Transaction</button></form>`);tform.onsubmit=e=>{e.preventDefault();db.transactions.push({id:uid('tr'),person:tform.person.value.trim(),amount:Number(tform.amount.value),note:tform.note.value.trim(),date:tform.date.value});save();closeModal();render();toastMsg('Transaction saved')}}
function del(key,id){if(!confirm('Delete this item?'))return;db[key]=db[key].filter(x=>x.id!==id);save();render()}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
